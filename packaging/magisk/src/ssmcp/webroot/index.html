<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#141516">
  <title>ssmcp · 设备终端</title>
  <link rel="stylesheet" href="console.css">
  <script type="module" src="console.js"></script>
</head>
<body data-page="terminal" data-view="notice">
  <header class="setup-header">
    <div class="brand"><span class="prompt-mark" aria-hidden="true"></span><strong>ssmcp</strong></div>
    <a class="text-link" href="https://ssmcp.lmm.best" target="_blank" rel="noopener">使用教程 <span aria-hidden="true">↗</span></a>
  </header>
  <main>
    <div class="notice-heading"><h1>设备终端</h1></div>
    <p id="status" role="status" aria-live="polite">正在读取终端状态…</p>
    <a id="open-setup" class="page-action" href="/setup" hidden>打开安装引导</a>
    <section id="console" aria-labelledby="terminal-title" hidden>
      <header class="terminal-header">
        <span class="prompt-mark" aria-hidden="true"></span>
        <div class="terminal-identity">
          <h1 id="terminal-title">设备终端</h1>
          <span id="target"></span>
        </div>
        <p id="connection" role="status"></p>
        <details id="plugin">
          <summary>资料<span class="chevron" aria-hidden="true"></span></summary>
          <div class="plugin-panel">
            <h2>连接信息</h2>
            <dl>
              <dt>MCP 地址</dt><dd><code id="mcp"></code></dd>
            </dl>
            <a class="panel-link" id="traffic" href="https://ssmcp.lmm.best/account/traffic" target="_blank" rel="noopener">查看额度或购买流量 <span aria-hidden="true">↗</span></a>
            <a class="panel-link" href="https://ssmcp.lmm.best" target="_blank" rel="noopener">查看使用教程 <span aria-hidden="true">↗</span></a>
          </div>
        </details>
      </header>
      <nav id="tabs" aria-label="终端会话"></nav>
      <div class="terminal-workspace">
        <pre id="screen" tabindex="0" aria-label="终端输出，点击可直接输入" title="点击终端以直接输入"></pre>
        <span id="terminal-cursor" aria-hidden="true" hidden></span>
        <textarea id="direct-input" rows="1" aria-label="直接输入到当前终端" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea>
      </div>
      <div class="terminal-dock">
        <div id="keys" role="group" aria-label="终端快捷键">
          <button type="button" data-key="Ctrl" aria-pressed="false">Ctrl</button>
          <button type="button" data-key="Escape">Esc</button>
          <button type="button" data-key="Tab">Tab</button>
          <button type="button" data-key="ArrowLeft" aria-label="向左">←</button>
          <button type="button" data-key="ArrowUp" aria-label="向上">↑</button>
          <button type="button" data-key="ArrowDown" aria-label="向下">↓</button>
          <button type="button" data-key="ArrowRight" aria-label="向右">→</button>
          <button type="button" data-key="Enter">Enter</button>
        </div>
        <div id="input-row">
          <span class="input-prompt" aria-hidden="true">›</span>
          <input id="input" aria-label="命令草稿，点击发送后执行" placeholder="编辑命令，再发送…" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="send">
          <button type="button" id="send" class="primary">发送</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
