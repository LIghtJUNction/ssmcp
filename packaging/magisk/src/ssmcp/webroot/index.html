<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <title>SSMCP 终端</title>
  <link rel="stylesheet" href="console.css">
  <script type="module" src="console.js"></script>
</head>
<body data-page="terminal" data-view="notice">
  <main>
    <p id="status" role="status"></p>
    <a id="open-setup" class="page-action" href="/setup" hidden>打开安装引导</a>
    <section id="console" aria-label="设备终端" hidden>
      <nav id="tabs" aria-label="会话"></nav>
      <div class="terminal-workspace">
        <pre id="screen" tabindex="0" aria-label="终端输出，点击可直接输入"></pre>
        <span id="terminal-cursor" aria-hidden="true" hidden></span>
        <textarea id="direct-input" rows="1" aria-label="终端输入" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea>
      </div>
      <div id="keys" role="group" aria-label="终端按键">
        <button type="button" id="open-keyboard" aria-label="打开键盘">⌨</button>
        <button type="button" data-key="Tab" aria-label="Tab 补全">Tab 补全</button>
        <button type="button" data-key="Escape">Esc</button>
        <button type="button" data-key="Ctrl" aria-pressed="false" title="按 Ctrl 后输入一个英文字母">Ctrl</button>
        <button type="button" data-key="ArrowLeft" aria-label="向左">←</button>
        <button type="button" data-key="ArrowUp" aria-label="向上">↑</button>
        <button type="button" data-key="ArrowDown" aria-label="向下">↓</button>
        <button type="button" data-key="ArrowRight" aria-label="向右">→</button>
        <button type="button" data-key="Enter" aria-label="回车">↵</button>
      </div>
    </section>
  </main>
</body>
</html>
