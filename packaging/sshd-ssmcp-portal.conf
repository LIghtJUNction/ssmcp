# Optional, AFTER 60-ssmcp.conf. Create ssmcp-portal group before enabling.
# All portal users also belong to ssmcp, inheriting its forced bridge and restrictions.
Match Group ssmcp-portal
    # Permit self-service accounts when the server has an existing AllowUsers list.
    AllowUsers gh-*
    AuthorizedKeysFile /var/lib/ssmcp-ssh/%u
Match all
