<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">ssmcp: local tools, one SSH connection, two MCP tools</title>
  <desc id="desc">The local ssmcp client runs a shell, Codex, Claude Code, Pi or OpenCode. It connects to ssmcpd using an outbound, public-key-authenticated SSH connection. An MCP client reaches the server over HTTPS with OAuth. Calls travel back to the local backend and results return over the same connections. The external MCP tools are list and code_mode.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#627187" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .label { fill: #a5b1c1; font-size: 15px; letter-spacing: 1.7px; }
    .body { fill: #acb8c9; font-size: 21px; }
    .route { fill: none; stroke: #344155; stroke-width: 1.5; marker-end: url(#arrow); }
    .packet { fill: none; stroke: #8bbaff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 12 116; animation: travel 4.2s linear infinite; }
    .return { opacity: .55; animation-delay: -2.1s; }
    .status { animation: breathe 4.2s ease-in-out infinite; }
    @keyframes travel { from { stroke-dashoffset: 128; } to { stroke-dashoffset: 0; } }
    @keyframes breathe { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .packet, .status { animation: none; } .packet { stroke-dasharray: none; opacity: .55; } }
  </style>
  <rect width="1080" height="470" rx="20" fill="#0a0d12"/>
  <text x="48" y="62" fill="#f1f5fb" font-size="34" font-weight="650">Your tools stay on your machine.</text>
  <text x="48" y="99" class="body">One SSH connection. Two MCP tools. Live local output.</text>

  <rect x="48" y="153" width="292" height="208" rx="12" fill="#131922" stroke="#263142"/>
  <text x="72" y="185" class="label">YOUR MACHINE</text>
  <path d="m73 211 8 7-8 7m14 0h12" fill="none" stroke="#8bbaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="111" y="228" fill="#f1f5fb" font-size="30" font-weight="600" class="mono">ssmcp</text>
  <text x="72" y="271" class="body mono">shell · codex · cc</text>
  <text x="72" y="302" class="body mono">pi · opencode</text>
  <circle cx="77" cy="334" r="4" fill="#8bbaff" class="status"/>
  <text x="90" y="340" fill="#8bbaff" font-size="17">Local execution + live logs</text>

  <rect x="453" y="153" width="198" height="208" rx="12" fill="#131922" stroke="#263142"/>
  <text x="477" y="185" class="label">YOUR SERVER</text>
  <text x="477" y="231" fill="#f1f5fb" font-size="29" font-weight="600" class="mono">ssmcpd</text>
  <text x="477" y="272" class="body">Route calls</text>
  <text x="477" y="303" class="body">Verify access</text>
  <text x="477" y="339" fill="#7f8da1" font-size="17" class="mono">/username</text>

  <rect x="764" y="153" width="268" height="208" rx="12" fill="#131922" stroke="#263142"/>
  <text x="788" y="185" class="label">MCP CLIENT</text>
  <text x="788" y="231" fill="#f1f5fb" font-size="29" font-weight="600">Discover. Call.</text>
  <text x="788" y="278" fill="#8bbaff" font-size="24" class="mono">list</text>
  <text x="788" y="314" fill="#8bbaff" font-size="24" class="mono">code_mode</text>
  <text x="788" y="340" fill="#7f8da1" font-size="17">OAuth-authorized requests</text>

  <text x="396" y="216" fill="#acb8c9" font-size="17" text-anchor="middle">SSH</text>
  <text x="708" y="216" fill="#acb8c9" font-size="17" text-anchor="middle">HTTPS</text>
  <path d="M447 248H346" class="route"/>
  <path d="M758 248H657" class="route"/>
  <path d="M346 292H447" class="route"/>
  <path d="M657 292H758" class="route"/>
  <path d="M447 248H346" class="packet"/>
  <path d="M758 248H657" class="packet"/>
  <path d="M346 292H447" class="packet return"/>
  <path d="M657 292H758" class="packet return"/>
  <text x="396" y="329" fill="#7f8da1" font-size="15" text-anchor="middle">public key</text>
  <text x="708" y="329" fill="#7f8da1" font-size="15" text-anchor="middle">OAuth</text>

  <path d="M48 393H1032" stroke="#263142"/>
  <path d="M63 426H49m5-5-5 5 5 5" fill="none" stroke="#8bbaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="77" y="433" fill="#c5d1e1" font-size="19">Calls reach your local tools.</text>
  <path d="M570 426h14m-5-5 5 5-5 5" fill="none" stroke="#8bbaff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="598" y="433" fill="#c5d1e1" font-size="19">Results return over the same connection.</text>
</svg>
