<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">ssmcp GitHub login: declare access, connect with SSH, sign in and consent</title>
  <desc id="desc">Start ssmcp with an allow list of GitHub users. Existing SSH keys and configuration connect the local machine to the server; no GitHub login is needed in the CLI. Add the returned /mcp URL to an MCP client and sign in with GitHub in the browser. On the separate ssmcp consent screen, review the verified identity, MCP client name and callback origin, then explicitly allow that MCP client. Only online sessions whose allow lists match the verified stable GitHub user ID can be discovered and called.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .step { fill: #f1f5fb; font-size: 25px; font-weight: 600; }
    .detail { fill: #a8b5c8; font-size: 21px; }
    .number { fill: #8bbaff; font-size: 19px; font-weight: 600; text-anchor: middle; }
    .progress { fill: none; stroke: #8bbaff; stroke-width: 3; stroke-dasharray: 24 312; animation: progress 8s linear infinite; }
    @keyframes progress { from { stroke-dashoffset: 336; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .progress { animation: none; stroke-dasharray: none; opacity: .45; } }
  </style>
  <rect width="1080" height="620" rx="20" fill="#0a0d12"/>
  <text x="48" y="62" fill="#f1f5fb" font-size="34" font-weight="650">SSH connects. GitHub identifies.</text>
  <text x="48" y="99" class="detail">You choose who can reach each local client.</text>

  <path d="M76 166V478" stroke="#2c394c" stroke-width="2"/>
  <path d="M76 166V478" class="progress"/>
  <circle cx="76" cy="166" r="23" fill="#142033" stroke="#3d5473"/>
  <text x="76" y="173" class="number">1</text>
  <text x="124" y="164" class="step">Choose who may connect</text>
  <text x="124" y="198" class="detail mono">ssmcp --allow octocat@github my-server</text>

  <circle cx="76" cy="270" r="23" fill="#142033" stroke="#3d5473"/>
  <text x="76" y="277" class="number">2</text>
  <text x="124" y="268" class="step">Connect with your existing SSH key</text>
  <text x="124" y="302" class="detail">Your SSH config stays in use. The terminal returns the <tspan class="mono">/mcp</tspan> URL.</text>

  <circle cx="76" cy="374" r="23" fill="#142033" stroke="#3d5473"/>
  <text x="76" y="381" class="number">3</text>
  <text x="124" y="372" class="step">Sign in with GitHub in the browser</text>
  <text x="124" y="406" class="detail">Add the URL to your MCP app, then verify your GitHub identity.</text>

  <circle cx="76" cy="478" r="23" fill="#142033" stroke="#3d5473"/>
  <text x="76" y="485" class="number">4</text>
  <text x="124" y="476" class="step">Approve this MCP client</text>
  <text x="124" y="510" class="detail">Review identity, client name and callback. Only allowed sessions appear.</text>

  <path d="M48 547H1032" stroke="#263142"/>
  <text x="48" y="585" fill="#8bbaff" font-size="19">No GitHub login in the CLI.</text>
  <text x="532" y="585" fill="#c5d1e1" font-size="19">Each session follows its <tspan class="mono">--allow</tspan> policy.</text>
</svg>
