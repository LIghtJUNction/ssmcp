[package]
name = "ssmcp"
version = "0.7.1"
edition = "2024"
rust-version = "1.89"
description = "Connect local tools and remote terminals through authenticated MCP sessions"
license = "MIT"
repository = "https://github.com/LIghtJUNction/ssmcp"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/Makefile",
    "/rust-toolchain.toml",
    "/src/**",
    "/skills/**",
    "/docs/workspaces.md",
    "/docs/context.md",
    "/docs/session-control.md",
    "/docs/client-service-platforms.md",
    "/docs/session-service.md",
    "/docs/design/session-service.md",
    "/scripts/e2e_session_service.py",
    "/scripts/e2e_attach_service.py",
    "/scripts/e2e_service_portable.py",
    "/docs/terminal-control.md",
    "/docs/validation-terminal-control.md",
    "/docs/reports/terminal-control-2026-11-16/**",
    "/scripts/e2e_terminal_control.py",
    "/docs/validation-context-primitives.md",
    "/docs/validation-workspace-bridge.md",
    "/docs/native-control.md",
    "/docs/computer-use.md",
    "/docs/onboarding.md",
    "/docs/validation-computer-use.md",
    "/docs/reports/computer-use-*.json",
    "/docs/validation-native-control.md",
    "/docs/reports/native-control-*.json",
    "/tests/**",
    "/scripts/release.py",
    "/scripts/test_release.py",
    "/docs/commands.md",
    "/docs/client-accounts.md",
    "/docs/validation-client-accounts.md",
    "/scripts/test_client_bootstrap.py",
    "/scripts/e2e_account_relay.py",
    "/scripts/e2e_account_interactive.py",
    "/scripts/test_installers.py",
    "/scripts/test_installer_download_bounds.py",
    "/scripts/test_installer_helpers.ps1",
    "/scripts/install.ps1",
    "/scripts/install.sh",
    "/docs/releases.md",
    "/docs/release-notes-*.md",
    "/scripts/e2e.py",
    "/scripts/test_cua_facade.mjs",
    "/scripts/test_execution_helpers.mjs",
    "/scripts/test_tools_search.mjs",
    "/docs/browser-existing-session.md",
    "/docs/reports/browser-existing-session-20261117-inventory.json",
    "/docs/reports/browser-efficiency-20261117/**",
    "/scripts/e2e_computer_use.py",
    "/scripts/e2e_onboarding.py",
    "/scripts/e2e_session_features.py",
    "/scripts/e2e_agents.py",
    "/scripts/e2e_unified.py",
    "/scripts/e2e_daemon.py",
    "/scripts/e2e_dashboard.py",
    "/examples/vt_snapshot.rs",
    "/docs/validation-0.6.0.md",
    "/scripts/smoke_pi.py",
    "/scripts/sync_portal_ssh.py",
    "/scripts/test_portal_ssh.py",
    "/scripts/test_registry_restart.py",
    "/scripts/deploy_server.py",
    "/scripts/render_log_preview.py",
    "/packaging/ssmcp-portal-ssh.*",
    "/packaging/ssmcp-portal.service",
    "/packaging/sshd-ssmcp-portal.conf",
    "/docs/backends.md",
    "/docs/configuration.md",
    "/docs/deployment.md",
    "/docs/validation.md",
    "/docs/validation-portal.md",
    "/docs/portal-console.md",
    "/docs/validation-portal-console.md",
    "/docs/assets/**",
    "/packaging/man/**",
    "/packaging/Caddyfile",
    "/packaging/nginx-ssmcp.conf.example",
    "/packaging/nginx-ssmcp-portal.conf.example",
    "/packaging/ssmcp-client.toml.example",
    "/scripts/deploy_server.py",
    "/scripts/render_log_preview.py",
    "/docs/logging.md",
    "/docs/validation-readable-logs.md",
    "/packaging/sshd-ssmcp.conf",
    "/packaging/ssmcpd.env",
    "/packaging/ssmcpd.service",
    "/packaging/ssmcpd.toml.example",
]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "form", "query", "ws"] }
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2.6"
toml = "0.8"
unicode-width = "0.2"
vt100 = "0.18.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "signal", "time", "fs"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
portable-pty = "0.9"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_StationsAndDesktops", "Win32_System_Com", "Win32_System_Services", "Win32_System_Com_StructuredStorage", "Win32_System_Memory"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
