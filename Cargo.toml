[package]
name = "ssmcp"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "Expose a local shell or coding agent as MCP through SSH public-key authentication"
license = "MIT"
repository = "https://github.com/LIghtJUNction/ssmcp"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/Makefile",
    "/rust-toolchain.toml",
    "/src/**",
    "/skills/**",
    "/docs/workspaces.md",
    "/docs/context.md",
    "/docs/session-control.md",
    "/docs/validation-context-primitives.md",
    "/docs/validation-workspace-bridge.md",
    "/tests/**",
    "/scripts/release.py",
    "/scripts/test_release.py",
    "/docs/commands.md",
    "/scripts/test_installers.py",
    "/scripts/install.ps1",
    "/scripts/install.sh",
    "/docs/releases.md",
    "/scripts/e2e.py",
    "/scripts/e2e_session_features.py",
    "/scripts/e2e_agents.py",
    "/scripts/smoke_pi.py",
    "/scripts/sync_portal_ssh.py",
    "/scripts/test_portal_ssh.py",
    "/scripts/test_registry_restart.py",
    "/scripts/deploy_server.py",
    "/scripts/render_log_preview.py",
    "/packaging/ssmcp-portal-ssh.*",
    "/packaging/ssmcp-portal.service",
    "/packaging/sshd-ssmcp-portal.conf",
    "/docs/backends.md",
    "/docs/configuration.md",
    "/docs/deployment.md",
    "/docs/validation.md",
    "/docs/validation-portal.md",
    "/docs/assets/**",
    "/packaging/man/**",
    "/packaging/Caddyfile",
    "/packaging/nginx-ssmcp.conf.example",
    "/packaging/ssmcp-client.toml.example",
    "/scripts/deploy_server.py",
    "/scripts/render_log_preview.py",
    "/docs/logging.md",
    "/docs/validation-readable-logs.md",
    "/packaging/sshd-ssmcp.conf",
    "/packaging/ssmcpd.env",
    "/packaging/ssmcpd.service",
    "/packaging/ssmcpd.toml.example",
]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "form", "query"] }
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2.6"
toml = "0.8"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "signal", "time", "fs"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
portable-pty = "0.9"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
