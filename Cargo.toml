[workspace]
members = ["crates/ztui"]
exclude = ["crates/zharness", "crates/zplugin"]
resolver = "3"

[dependencies]
ztui = { package = "ztui-core", version = "=0.1.2", path = "crates/ztui" }
zharness = { version = "=0.5.0", path = "crates/zharness", default-features = false, features = ["std"] }
zplugin = { version = "=0.3.0", path = "crates/zplugin", default-features = false, features = ["std", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "form", "query", "ws"] }
base64 = "0.22"
qrcodegen = "1.8.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "0.18"
memchr = "2.7"
getrandom = "0.3"
libc = "0.2"
miniz_oxide = "0.9.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2.6"
toml = "0.8"
toml_edit = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
unicode-width = "0.2"
vt100 = "0.18.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "signal", "time", "fs"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
portable-pty = "0.9"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_StationsAndDesktops", "Win32_System_Com", "Win32_System_Services", "Win32_System_Com_StructuredStorage", "Win32_System_Memory"] }

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[patch.crates-io]
zplugin = { path = "crates/zplugin" }

[[example]]
name = "native_plugin_fixture"
path = "tests/fixtures/native_plugin.rs"
crate-type = ["cdylib"]
test = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
