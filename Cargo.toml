[workspace]
members = []
exclude = ["crates/zharness", "crates/zplugin", "crates/ztuio", "crates/zbridge"]
resolver = "3"

[features]
# Used only by the debug CLI built specifically for offline loopback integration tests.
e2e-loopback-ca = []

[dependencies]
zbridge = { version = "=0.1.0", git = "https://github.com/LIghtJUNction/zbridge.git" }
ztuio = { version = "=0.1.0", git = "https://github.com/LIghtJUNction/ztuio.git" }
zi18n = { version = "=0.1.0", git = "https://github.com/LIghtJUNction/zi18n.git" }
zhex = { version = "=0.1.3", git = "https://github.com/LIghtJUNction/zhex.git" }
zharness = { version = "=0.6.0", git = "https://github.com/LIghtJUNction/zharness.git", default-features = false, features = ["std"] }
zplugin = { version = "=0.3.1", git = "https://github.com/LIghtJUNction/zplugin.git", default-features = false, features = ["std", "macros"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "form", "query", "ws"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "=0.18.1"
getrandom = { version = "=0.4.3", default-features = false }
httpdate = "=1.0.3"
libc = "=0.2.191"
miniz_oxide = "=0.9.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
serde_urlencoded = "=0.7.1"
sha2 = { version = "=0.11.2", default-features = false, features = ["alloc"] }
subtle = "=2.6.1"
toml = { version = "=1.2.3", default-features = false, features = ["std", "serde", "parse", "display"] }
toml_edit = { version = "=0.25.21", default-features = false, features = ["parse", "display"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
ring = "=0.17.14"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "=0.103.17", default-features = false, features = ["ring", "std"] }
webpki-roots = "=1.0.12"
unicode-width = "=0.2.3"
vt100 = "=0.18.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "signal", "time", "fs"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }

[target.'cfg(all(not(target_os = "macos"), not(windows)))'.dependencies]
mime = "=0.3.18"

[target.'cfg(target_os = "linux")'.dependencies]
webauthn-rs = { version = "=0.6.2", default-features = false, features = ["conditional-ui"] }
time = { version = "=0.3.55", default-features = false }

[target.'cfg(unix)'.dependencies]
zrun = { version = "=0.1.0-p0.15", git = "https://github.com/LIghtJUNction/zrun.git", features = ["process"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
portable-pty = "=0.9.0"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_StationsAndDesktops", "Win32_System_Com", "Win32_System_Services", "Win32_System_Com_StructuredStorage", "Win32_System_Memory"] }

[[example]]
name = "native_plugin_fixture"
path = "tests/fixtures/native_plugin.rs"
crate-type = ["cdylib"]
test = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
