[package]
name = "ssmcp-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "A native, capability-driven desktop client for existing ssmcp sessions"
license = "MIT"

# This application has its own lockfile. zbridge is deliberately resolved from
# the same canonical source used by ssmcp and zgpui, not a second rev-qualified
# source with incompatible Rust protocol types. See README for the locked SHA.
[workspace]
resolver = "3"

[features]
default = []
linux-software = ["zgpui/linux-software"]

[dependencies]
ssmcp = { path = "../.." }
zgpui = { git = "https://github.com/LIghtJUNction/zgpui.git", rev = "d34c41f79ddab343e7468c5192885a82ca487687", default-features = false, features = ["native", "bridge"] }
serde_json = "1"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
vt100 = "0.18.1"
unicode-width = "0.2"
tokio = { version = "1.54", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "test-util"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
