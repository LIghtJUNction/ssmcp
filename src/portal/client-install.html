<section class="workspace-section" id="install" aria-labelledby="install-title">
  <div class="section-heading">
    <h2 id="install-title">安装 ssmcp 客户端</h2>
    <p class="section-description">复制对应系统的命令，在本机终端运行。</p>
  </div>
  <div>
    <h3>Linux / macOS</h3>
    <pre class="command"><code id="install-unix">curl -fsSL https://github.com/LIghtJUNction/ssmcp/releases/latest/download/install.sh | sh</code></pre>
    <button class="secondary" type="button" data-install-copy="install-unix" aria-label="复制 Linux 或 macOS 安装命令" hidden>复制安装命令</button>
    <span role="status"></span>
  </div>
  <div>
    <h3>Windows PowerShell</h3>
    <pre class="command"><code id="install-windows">irm https://github.com/LIghtJUNction/ssmcp/releases/latest/download/install.ps1 | iex</code></pre>
    <button class="secondary" type="button" data-install-copy="install-windows" aria-label="复制 Windows 安装命令" hidden>复制安装命令</button>
    <span role="status"></span>
  </div>
  <script src="/client-install-copy.js" defer></script>
</section>
