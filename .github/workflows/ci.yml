name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit to validate
        required: false
        type: string
      clients_only:
        description: Validate native macOS and Windows clients only
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        required: false
        type: string
      clients_only:
        description: Validate native macOS and Windows clients only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: ${{ !inputs.clients_only }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nodejs bubblewrap util-linux rsync apparmor-profiles shellcheck
          if test -e /sys/module/apparmor/parameters/enabled && grep -q Y /sys/module/apparmor/parameters/enabled; then
            if test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict; then
              sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
              sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            fi
          fi
      - name: Select and identify the installed system Node
        run: |
          # Only node is shadowed; cargo, gh and all other runner tools retain
          # their original PATH lookup. Discovery still validates the real binary.
          ssmcp_node_bin="$(mktemp -d "$RUNNER_TEMP/ssmcp-node.XXXXXX")"
          ln -s /usr/bin/node "$ssmcp_node_bin/node"
          printf '%s\n' "$ssmcp_node_bin" >> "$GITHUB_PATH"
          export PATH="$ssmcp_node_bin:$PATH"
          ssmcp_node_real="$(readlink -f "$(command -v node)")"
          test "$ssmcp_node_real" = "$(readlink -f /usr/bin/node)"
          printf 'Runtime executable: %s\n' "$ssmcp_node_real"
          node --version
      - run: cargo fmt --all -- --check
      - name: Check release tooling and installer
        run: |
          shellcheck scripts/install.sh
          python3 scripts/test_release.py
          python3 scripts/test_setup_server.py
          python3 scripts/test_installer_download_bounds.py
      - name: Check JavaScript orchestration helpers
        run: make test-code-mode
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Render terminal transcript fixture
        if: matrix.runner == 'ubuntu-24.04'
        env:
          SSMCP_RENDER_PREVIEW: ${{ runner.temp }}/ssmcp-terminal.ansi
        run: cargo test --locked --lib client::render::tests::terminal_preview_fixture -- --exact
      - name: Save terminal transcript for visual review
        if: matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-preview
          path: ${{ runner.temp }}/ssmcp-terminal.ansi
          if-no-files-found: error
          retention-days: 14
      - run: cargo test --workspace --locked
      - name: Build the explicit native plugin fixture
        run: cargo build --example native_plugin_fixture --locked
      - name: Exercise the native plugin through Runtime
        run: cargo test --lib --locked runtime::plugins::tests::native_plugin_runtime_contract -- --ignored --exact
      - name: Exercise system Node.js and bubblewrap
        run: |
          cargo test --locked --lib code_mode::tests -- --include-ignored
          cargo test --locked --test server_runtime -- --include-ignored
          cargo test --locked --test two_tools -- --include-ignored
          cargo test --locked --test workspace_bridge -- --ignored --test-threads=1
          cargo test --locked --test context_helpers -- --ignored --test-threads=1
      - name: Exercise runtime under installed service restrictions
        run: |
          runtime_test="$(cargo test --locked --lib --no-run --message-format=json | python3 -c 'import json,sys; print(next(m["executable"] for m in map(json.loads,sys.stdin) if m.get("reason")=="compiler-artifact" and m.get("profile",{}).get("test") and m.get("executable")))')"
          sudo install -Dm0755 "$runtime_test" /usr/local/bin/ssmcp-runtime-test
          sudo install -Dm0644 src/code_mode.js /usr/local/libexec/ssmcp/code-mode.js
          restrictions=()
          while IFS= read -r property; do
            restrictions+=("--property=$property")
          done < <(grep -E '^(NoNewPrivileges|PrivateTmp|PrivateDevices|ProtectSystem|ProtectHome|ProtectKernelTunables|ProtectControlGroups|RestrictAddressFamilies|ReadWritePaths)=' packaging/ssmcpd.service)
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit=ssmcp-runtime-test \
            --uid="$(id -u)" --gid="$(id -g)" \
            --setenv=PATH=/usr/bin:/bin \
            "${restrictions[@]}" \
            /usr/local/bin/ssmcp-runtime-test \
            --exact code_mode::tests::real_system_runtime_uses_mandatory_os_isolation --ignored --nocapture
      - run: cargo build --locked --bins --example vt_snapshot
      - name: Preserve DCR through a real daemon restart
        run: python3 scripts/test_registry_restart.py --bin-dir target/debug
      - name: Verify the installed daemon rejects legacy SSH attachment
        run: |
          if target/debug/ssmcpd attach; then
            echo "The SSH attachment command should be retired" >&2
            exit 1
          fi
      - name: Exercise OAuth account login and relay lifecycle
        run: python3 scripts/e2e_account_relay.py --binary target/debug/ssmcp
      - name: Exercise OAuth router and conversation through a real PTY
        run: make test-client-ui
      - run: cargo build --locked --release
      - name: Check staged Linux installation
        run: |
          make install-server DESTDIR="$RUNNER_TEMP/ssmcp-install"
          test -x "$RUNNER_TEMP/ssmcp-install/usr/local/bin/ssmcp"
          test -x "$RUNNER_TEMP/ssmcp-install/usr/local/bin/ssmcpd"
          test -f "$RUNNER_TEMP/ssmcp-install/usr/lib/systemd/system/ssmcpd.service"
          test -f "$RUNNER_TEMP/ssmcp-install/usr/local/libexec/ssmcp/code-mode.js"

  client:
    name: Client (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.100.0
          components: clippy
      - run: cargo clippy --locked --lib --bin ssmcp --test release_client -- -D warnings
      - run: cargo test --locked --lib --bin ssmcp --test release_client
      - name: Build the explicit native plugin fixture
        run: cargo build --example native_plugin_fixture --locked
      - name: Exercise the native plugin through Runtime
        run: cargo test --lib --locked runtime::plugins::tests::native_plugin_runtime_contract -- --ignored --exact
      - name: Check and test the zero-dependency TUI primitives
        run: |
          cargo clippy --locked -p ztui-core --all-targets -- -D warnings
          cargo test --locked -p ztui-core
      - run: cargo build --locked --bin ssmcp
      - name: Check client startup
        shell: bash
        run: |
          target/debug/ssmcp --version
          target/debug/ssmcp --help
      - name: Save validated native development client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-client-${{ matrix.runner }}
          path: target/debug/ssmcp${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 14
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
          & "$PWD/scripts/test_installer_helpers.ps1"
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File "$PWD/scripts/test_installer_helpers.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell installer helper tests failed" }
      - name: Check Unix streaming download bounds
        if: runner.os == 'macOS'
        run: python3 scripts/test_installer_download_bounds.py
