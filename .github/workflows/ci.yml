name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit to validate
        required: false
        type: string
      clients_only:
        description: Validate native macOS and Windows clients only
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        required: false
        type: string
      clients_only:
        description: Validate native macOS and Windows clients only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: ${{ !inputs.clients_only }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server nodejs bubblewrap util-linux rsync apparmor-profiles shellcheck
          if test -e /sys/module/apparmor/parameters/enabled && grep -q Y /sys/module/apparmor/parameters/enabled; then
            if test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict; then
              sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
              sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            fi
          fi
      - name: Select and identify the installed system Node
        run: |
          # Only node is shadowed; cargo, gh and all other runner tools retain
          # their original PATH lookup. Discovery still validates the real binary.
          ssmcp_node_bin="$(mktemp -d "$RUNNER_TEMP/ssmcp-node.XXXXXX")"
          ln -s /usr/bin/node "$ssmcp_node_bin/node"
          printf '%s\n' "$ssmcp_node_bin" >> "$GITHUB_PATH"
          export PATH="$ssmcp_node_bin:$PATH"
          ssmcp_node_real="$(readlink -f "$(command -v node)")"
          test "$ssmcp_node_real" = "$(readlink -f /usr/bin/node)"
          printf 'Runtime executable: %s\n' "$ssmcp_node_real"
          node --version
      - run: cargo fmt --all -- --check
      - name: Check release tooling and installer
        run: |
          shellcheck scripts/install.sh
          python3 scripts/test_release.py
          python3 scripts/test_setup_server.py
          python3 scripts/test_portal_ssh.py
          python3 scripts/test_installer_download_bounds.py
      - name: Check JavaScript orchestration helpers
        run: make test-code-mode
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Render terminal transcript fixture
        if: matrix.runner == 'ubuntu-24.04'
        env:
          SSMCP_RENDER_PREVIEW: ${{ runner.temp }}/ssmcp-terminal.ansi
        run: cargo test --locked --lib client::render::tests::terminal_preview_fixture -- --exact
      - name: Save terminal transcript for visual review
        if: matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-preview
          path: ${{ runner.temp }}/ssmcp-terminal.ansi
          if-no-files-found: error
          retention-days: 14
      - run: cargo test --workspace --locked
      - name: Exercise system Node.js and bubblewrap
        run: |
          cargo test --locked --lib code_mode::tests -- --include-ignored
          cargo test --locked --test server_runtime -- --include-ignored
          cargo test --locked --test two_tools -- --include-ignored
          cargo test --locked --test workspace_bridge -- --ignored --test-threads=1
          cargo test --locked --test context_helpers -- --ignored --test-threads=1
      - name: Exercise runtime under installed service restrictions
        run: |
          runtime_test="$(cargo test --locked --lib --no-run --message-format=json | python3 -c 'import json,sys; print(next(m["executable"] for m in map(json.loads,sys.stdin) if m.get("reason")=="compiler-artifact" and m.get("profile",{}).get("test") and m.get("executable")))')"
          sudo install -Dm0755 "$runtime_test" /usr/local/bin/ssmcp-runtime-test
          sudo install -Dm0644 src/code_mode.js /usr/local/libexec/ssmcp/code-mode.js
          restrictions=()
          while IFS= read -r property; do
            restrictions+=("--property=$property")
          done < <(grep -E '^(NoNewPrivileges|PrivateTmp|PrivateDevices|ProtectSystem|ProtectHome|ProtectKernelTunables|ProtectControlGroups|RestrictAddressFamilies|ReadWritePaths)=' packaging/ssmcpd.service)
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit=ssmcp-runtime-test \
            --uid="$(id -u)" --gid="$(id -g)" \
            --setenv=PATH=/usr/bin:/bin \
            "${restrictions[@]}" \
            /usr/local/bin/ssmcp-runtime-test \
            --exact code_mode::tests::real_system_runtime_uses_mandatory_os_isolation --ignored --nocapture
      - run: cargo build --locked --bins --example vt_snapshot
      - name: Preserve DCR through a real daemon restart
        run: python3 scripts/test_registry_restart.py --bin-dir target/debug
      - name: Exercise real SSH, OAuth, HTTP and PTY
        run: python3 scripts/e2e.py --bin-dir target/debug
      - name: Exercise automatic setup and cancellation through a real PTY
        run: python3 scripts/e2e_onboarding.py --binary target/debug/ssmcp --output "$RUNNER_TEMP/ssmcp-onboarding-report.json"
      - name: Exercise session title, reload and output artifacts
        run: python3 scripts/e2e_session_features.py --bin-dir target/debug
      - name: Exercise discovered harness fixtures through SSH and OAuth
        run: python3 scripts/e2e_agents.py --bin-dir target/debug
      - name: Exercise unified execution, audit and connection isolation
        run: python3 scripts/e2e_unified.py --bin-dir target/debug --report "$RUNNER_TEMP/ssmcp-unified-report.json" --revision "$(git rev-parse HEAD)"
      - name: Exercise computer-use, Omarchy discovery and image transport
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 scripts/e2e_computer_use.py --bin-dir target/debug --evidence-dir "$RUNNER_TEMP/ssmcp-computer-use" --report "$RUNNER_TEMP/ssmcp-computer-use-report.json"
      - name: Exercise terminal dashboard and Git observer through a real PTY
        run: python3 scripts/e2e_dashboard.py --bin-dir target/debug --report "$RUNNER_TEMP/ssmcp-dashboard-report.json"
      - name: Exercise conversation UI and SSH/account relay request queues
        run: make test-client-ui
      - name: Exercise background sessions and watchdog with real user systemd
        timeout-minutes: 8
        run: |
          ssmcp_ci_uid="$(id -u)"
          ssmcp_ci_user="$(id -un)"
          ssmcp_ci_manager_log="$RUNNER_TEMP/ssmcp-daemon-manager.log"
          ssmcp_ci_restore_linger=0
          export XDG_RUNTIME_DIR="/run/user/$ssmcp_ci_uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          restore_ci_linger() {
            if test "$ssmcp_ci_restore_linger" = 1; then
              timeout 20s sudo -n loginctl disable-linger "$ssmcp_ci_user" >>"$ssmcp_ci_manager_log" 2>&1 ||
                echo '::warning::Could not restore the hosted runner linger setting; see daemon manager evidence.'
            fi
          }
          trap restore_ci_linger EXIT
          if ! timeout 5s systemctl --user --no-pager show --property=Version >"$ssmcp_ci_manager_log" 2>&1; then
            # This prepares the ephemeral CI runner, not the product's startup policy.
            ssmcp_ci_linger="$(timeout 5s loginctl show-user "$ssmcp_ci_user" --property=Linger --value 2>>"$ssmcp_ci_manager_log" || true)"
            if test "$ssmcp_ci_linger" != yes; then
              if timeout 20s sudo -n loginctl enable-linger "$ssmcp_ci_user" >>"$ssmcp_ci_manager_log" 2>&1; then
                ssmcp_ci_restore_linger=1
              else
                echo '::warning::Hosted runner linger setup failed; checking the actual user manager next.'
              fi
            fi
            if ! timeout 20s sudo -n systemctl start "user@$ssmcp_ci_uid.service" >>"$ssmcp_ci_manager_log" 2>&1; then
              echo '::warning::Hosted runner user manager startup failed; daemon preflight will report the result.'
            fi
            for ssmcp_ci_attempt in {1..10}; do
              echo "User manager readiness attempt $ssmcp_ci_attempt/10" >>"$ssmcp_ci_manager_log"
              if timeout 3s systemctl --user --no-pager show --property=Version >>"$ssmcp_ci_manager_log" 2>&1; then
                break
              fi
              sleep 1
            done
          fi
          # Missing manager support is exit 2 with a blocked report, never a skipped pass.
          python3 scripts/e2e_daemon.py --bin-dir target/debug --timeout 300 \
            --report "$RUNNER_TEMP/ssmcp-daemon-report.json" --revision "$(git rev-parse HEAD)"
      - name: Save unified acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unified-acceptance-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/ssmcp-unified-report*
            ${{ runner.temp }}/ssmcp-dashboard-report*
            ${{ runner.temp }}/ssmcp-computer-use-report.json
            ${{ runner.temp }}/ssmcp-onboarding-report.json
            ${{ runner.temp }}/ssmcp-daemon-report*
            ${{ runner.temp }}/ssmcp-daemon-manager.log
          if-no-files-found: warn
          retention-days: 14
      - run: cargo build --locked --release
      - name: Check staged Linux installation
        run: |
          make install-server DESTDIR="$RUNNER_TEMP/ssmcp-install"
          test -x "$RUNNER_TEMP/ssmcp-install/usr/local/bin/ssmcp"
          test -x "$RUNNER_TEMP/ssmcp-install/usr/local/bin/ssmcpd"
          test -f "$RUNNER_TEMP/ssmcp-install/usr/lib/systemd/system/ssmcpd.service"
          test -f "$RUNNER_TEMP/ssmcp-install/usr/local/libexec/ssmcp/code-mode.js"

  client:
    name: Client (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.100.0
          components: clippy
      - run: cargo clippy --locked --lib --bin ssmcp --test release_client -- -D warnings
      - run: cargo test --locked --lib --bin ssmcp --test release_client
      - name: Check and test the zero-dependency TUI primitives
        run: |
          cargo clippy --locked -p ztui-core --all-targets -- -D warnings
          cargo test --locked -p ztui-core
      - run: cargo build --locked --bin ssmcp
      - name: Check client startup
        shell: bash
        run: |
          target/debug/ssmcp --version
          target/debug/ssmcp --help
      - name: Save validated native development client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-client-${{ matrix.runner }}
          path: target/debug/ssmcp${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 14
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
          & "$PWD/scripts/test_installer_helpers.ps1"
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File "$PWD/scripts/test_installer_helpers.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell installer helper tests failed" }
      - name: Check Unix streaming download bounds
        if: runner.os == 'macOS'
        run: python3 scripts/test_installer_download_bounds.py
