name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server nodejs bubblewrap util-linux rsync apparmor-profiles shellcheck
          if test -e /sys/module/apparmor/parameters/enabled && grep -q Y /sys/module/apparmor/parameters/enabled; then
            if test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict; then
              sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
              sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            fi
          fi
      - run: cargo fmt --all -- --check
      - name: Check release tooling and installer
        run: |
          shellcheck scripts/install.sh
          python3 scripts/test_release.py
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Render terminal transcript fixture
        if: matrix.runner == 'ubuntu-24.04'
        env:
          SSMCP_RENDER_PREVIEW: ${{ runner.temp }}/ssmcp-terminal.ansi
        run: cargo test --locked --lib client::render::tests::terminal_preview_fixture -- --exact
      - name: Save terminal transcript for visual review
        if: matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-preview
          path: ${{ runner.temp }}/ssmcp-terminal.ansi
          if-no-files-found: error
          retention-days: 14
      - run: cargo test --locked
      - name: Exercise system Node.js and bubblewrap
        run: |
          cargo test --locked --lib code_mode::tests -- --include-ignored
          cargo test --locked --test two_tools -- --include-ignored
          cargo test --locked --test workspace_bridge -- --ignored --test-threads=1
          cargo test --locked --test context_helpers -- --ignored --test-threads=1
      - name: Exercise runtime under installed service restrictions
        run: |
          runtime_test="$(cargo test --locked --lib --no-run --message-format=json | python3 -c 'import json,sys; print(next(m["executable"] for m in map(json.loads,sys.stdin) if m.get("reason")=="compiler-artifact" and m.get("profile",{}).get("test") and m.get("executable")))')"
          sudo install -Dm0755 "$runtime_test" /usr/local/bin/ssmcp-runtime-test
          sudo install -Dm0644 src/code_mode.js /usr/local/libexec/ssmcp/code-mode.js
          restrictions=()
          while IFS= read -r property; do
            restrictions+=("--property=$property")
          done < <(grep -E '^(NoNewPrivileges|PrivateTmp|PrivateDevices|ProtectSystem|ProtectHome|ProtectKernelTunables|ProtectControlGroups|RestrictAddressFamilies|ReadWritePaths)=' packaging/ssmcpd.service)
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit=ssmcp-runtime-test \
            --uid="$(id -u)" --gid="$(id -g)" \
            --setenv=PATH=/usr/bin:/bin \
            "${restrictions[@]}" \
            /usr/local/bin/ssmcp-runtime-test \
            --exact code_mode::tests::real_system_runtime_uses_mandatory_os_isolation --ignored --nocapture
      - run: cargo build --locked
      - name: Preserve DCR through a real daemon restart
        run: python3 scripts/test_registry_restart.py --bin-dir target/debug
      - name: Exercise real SSH, OAuth, HTTP and PTY
        run: python3 scripts/e2e.py --bin-dir target/debug
      - name: Exercise session title, reload and output artifacts
        run: python3 scripts/e2e_session_features.py --bin-dir target/debug
      - name: Exercise all five backends through SSH and OAuth
        run: python3 scripts/e2e_agents.py --bin-dir target/debug
      - run: cargo build --locked --release
      - name: Check staged Linux installation
        run: |
          make install-server DESTDIR="$RUNNER_TEMP/ssmcp-install"
          test -x "$RUNNER_TEMP/ssmcp-install/usr/local/bin/ssmcp"
          test -x "$RUNNER_TEMP/ssmcp-install/usr/local/bin/ssmcpd"
          test -f "$RUNNER_TEMP/ssmcp-install/usr/lib/systemd/system/ssmcpd.service"
          test -f "$RUNNER_TEMP/ssmcp-install/usr/local/libexec/ssmcp/code-mode.js"

  client:
    name: Client (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.100.0
          components: clippy
      - run: cargo clippy --locked --lib --bin ssmcp -- -D warnings
      - run: cargo test --locked --lib --bin ssmcp
      - run: cargo build --locked --bin ssmcp
      - name: Check client startup
        shell: bash
        run: |
          target/debug/ssmcp --version
          target/debug/ssmcp --help
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
