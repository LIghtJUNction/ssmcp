name: Session service

on:
  pull_request:
    paths:
      - 'src/session.rs'
      - 'src/session/**'
      - 'src/client.rs'
      - 'src/client/**'
      - 'src/runtime.rs'
      - 'src/registry.rs'
      - 'scripts/e2e_service_portable.py'
      - '.github/workflows/session-service.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: session-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Verify workspace unit tests on Linux
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked --lib -- --test-threads=4
      - run: "cargo test --locked --lib session:: -- --test-threads=4"
        if: runner.os != 'Linux'
      - run: "cargo test --locked --lib client::protocol_tests -- --test-threads=4"
        if: runner.os != 'Linux'
      - run: cargo build --locked --bin ssmcp
      - name: Exercise private native session lifecycle
        run: python scripts/e2e_service_portable.py --bin-dir target/debug --report target/acceptance/session-service.json --revision "${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}"
      - name: Preserve lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-service-${{ matrix.runner }}
          path: target/acceptance/
          if-no-files-found: warn
          retention-days: 14
