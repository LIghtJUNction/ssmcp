name: Session service

on:
  pull_request:
    paths:
      - 'src/session.rs'
      - 'src/session/**'
      - 'src/client.rs'
      - 'src/client/**'
      - 'src/runtime.rs'
      - 'src/registry.rs'
      - 'scripts/e2e_service_portable.py'
      - '.github/workflows/session-service.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: session-service-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Install Linux unit test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nodejs bubblewrap apparmor-profiles
          if test -e /sys/module/apparmor/parameters/enabled && grep -q Y /sys/module/apparmor/parameters/enabled; then
            if test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict; then
              sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
              sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            fi
          fi
      - name: Select and identify the installed system Node
        if: runner.os == 'Linux'
        run: |
          # Only node is shadowed; cargo, gh and all other runner tools retain
          # their original PATH lookup. Discovery still validates the real binary.
          ssmcp_node_bin="$(mktemp -d "$RUNNER_TEMP/ssmcp-node.XXXXXX")"
          ln -s /usr/bin/node "$ssmcp_node_bin/node"
          printf '%s\n' "$ssmcp_node_bin" >> "$GITHUB_PATH"
          export PATH="$ssmcp_node_bin:$PATH"
          ssmcp_node_real="$(readlink -f "$(command -v node)")"
          test "$ssmcp_node_real" = "$(readlink -f /usr/bin/node)"
          printf 'Runtime executable: %s\n' "$ssmcp_node_real"
          node --version
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Run unchanged Clippy gate with compiler annotations
        id: lint_gate
        shell: bash
        run: |
          set +e
          cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/ssmcp-lint.txt" 2>&1
          result=$?
          cat "$RUNNER_TEMP/ssmcp-lint.txt"
          if [ "$result" -ne 0 ]; then
            reason=$(sed -E 's/\x1b\[[0-9;]*[mK]//g' "$RUNNER_TEMP/ssmcp-lint.txt" | grep -E '^[[:space:]]*(error(\[[^]]+\])?:|-->)' | head -n 12 | tr '\r\n' '  ' | cut -c 1-1500)
            reason="${reason:-diagnostic output had no matching error lines}"
            printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
            printf '::error::%s\n' "$reason"
          fi
          exit "$result"
      - name: "Diagnostic ${{ steps.lint_gate.outputs.reason }}"
        if: failure() && steps.lint_gate.outcome == 'failure'
        shell: bash
        run: 'true'
      - name: Verify workspace unit tests on Linux
        id: lib_gate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked --lib -- --test-threads=4 > "$RUNNER_TEMP/ssmcp-lib.txt" 2>&1
          result=$?
          cat "$RUNNER_TEMP/ssmcp-lib.txt"
          if [ "$result" -ne 0 ]; then
            reason=$(sed -E 's/\x1b\[[0-9;]*[mK]//g' "$RUNNER_TEMP/ssmcp-lib.txt" | grep -E 'FAILED|panicked at|error:|test result:' | head -n 9 | tr '\r\n' '  ' | cut -c 1-480)
            reason="${reason:-diagnostic output had no matching error lines}"
            printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
            printf '::error::%s\n' "$reason"
          fi
          exit "$result"
      - name: "Diagnostic ${{ steps.lib_gate.outputs.reason }}"
        if: failure() && steps.lib_gate.outcome == 'failure'
        shell: bash
        run: 'true'
      - run: "cargo test --locked --lib session:: -- --test-threads=4"
        if: runner.os != 'Linux'
      - run: "cargo test --locked --lib client::protocol_tests -- --test-threads=4"
        if: runner.os != 'Linux'
      - run: cargo build --locked --bin ssmcp
      - name: Exercise private native session lifecycle
        run: python scripts/e2e_service_portable.py --bin-dir target/debug --report target/acceptance/session-service.json --revision "${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}"
      - name: Preserve lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-service-${{ matrix.runner }}
          path: target/acceptance/
          if-no-files-found: warn
          retention-days: 14
