name: GUI clients

# Manual/reusable checks of one immutable source revision. This workflow does
# not deploy, production-sign, publish a release, or exercise a live ssmcp connection.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character source commit SHA
        required: true
        type: string
      platform:
        description: Native client checks to run
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - linux
          - windows
          - android
  workflow_call:
    inputs:
      ref:
        description: Full 40-character source commit SHA
        required: true
        type: string
      platform:
        description: One of all, ios, linux, windows, android
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate requested revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.inputs.outputs.ref }}
      platform: ${{ steps.inputs.outputs.platform }}
      ios: ${{ steps.clients.outputs.ios }}
      linux: ${{ steps.clients.outputs.linux }}
      windows: ${{ steps.clients.outputs.windows }}
      android: ${{ steps.clients.outputs.android }}
    steps:
      - name: Require an exact commit and a supported platform
        id: inputs
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::ref must be a full 40-character commit SHA, not a branch or tag.'
            exit 1
          fi
          case "$REQUESTED_PLATFORM" in
            all|ios|linux|windows|android) ;;
            *) echo '::error::platform must be all, ios, linux, windows, or android.'; exit 1 ;;
          esac
          printf 'ref=%s\nplatform=%s\n' "${REQUESTED_REF,,}" "$REQUESTED_PLATFORM" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.inputs.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Require every requested application to exist at this revision
        id: clients
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import release
          clients = release.gui_clients(Path.cwd())
          requested = os.environ["REQUESTED_PLATFORM"]
          if not clients or (requested != "all" and requested not in clients):
              raise ValueError("the requested revision does not contain the selected GUI client")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for platform in release.GUI_CLIENTS:
                  selected = platform in clients and requested in ("all", platform)
                  output.write(f"{platform}={str(selected).lower()}\n")
          PY

  ios:
    name: iOS simulator build and XCTest
    needs: validate
    if: needs.validate.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: ${{ needs.validate.outputs.ref }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'

      - name: Record the source revision and Xcode project
        run: |
          set -euo pipefail
          IOS_EVIDENCE_DIR="$RUNNER_TEMP/ssmcp-gui-ci-ios"
          IOS_DERIVED_DATA="$RUNNER_TEMP/ssmcp-ios-derived-data"
          printf 'IOS_EVIDENCE_DIR=%s\nIOS_DERIVED_DATA=%s\n' \
            "$IOS_EVIDENCE_DIR" "$IOS_DERIVED_DATA" >> "$GITHUB_ENV"
          mkdir -p "$IOS_EVIDENCE_DIR"
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$SOURCE_COMMIT" ]]; then
            echo '::error::The checked-out commit does not match the requested commit.'
            exit 1
          fi
          printf 'source_commit=%s\nworkflow_commit=%s\nrunner=%s/%s\n' \
            "$actual_commit" "$GITHUB_WORKFLOW_SHA" "$RUNNER_OS" "$RUNNER_ARCH" \
            > "$IOS_EVIDENCE_DIR/revision.txt"
          xcodebuild -version 2>&1 | tee "$IOS_EVIDENCE_DIR/xcode-version.log"
          xcodebuild -showsdks 2>&1 | tee "$IOS_EVIDENCE_DIR/xcode-sdks.log"
          xcodebuild -list -project apps/ssmcp-ios/SSMCP.xcodeproj \
            2>&1 | tee "$IOS_EVIDENCE_DIR/xcode-project.log"

      - name: Select an installed iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$IOS_EVIDENCE_DIR/devices.json"
          xcrun simctl list runtimes --json > "$IOS_EVIDENCE_DIR/runtimes.json"
          python3 - <<'PY'
          import json
          import os
          import re
          import uuid
          from pathlib import Path

          def select_simulator(devices, runtimes):
              available = {}
              for runtime in runtimes.get("runtimes", []):
                  identifier = runtime.get("identifier", "")
                  version = runtime.get("version", "")
                  if (runtime.get("isAvailable") is True
                          and identifier.startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
                          and re.fullmatch(r"[0-9]+(?:\.[0-9]+)*", version)):
                      parts = tuple(int(part) for part in version.split("."))
                      if parts >= (16,):
                          available[identifier] = parts
              candidates = []
              for runtime, entries in devices.get("devices", {}).items():
                  if runtime not in available:
                      continue
                  for device in entries:
                      kind = device.get("deviceTypeIdentifier", "")
                      name = device.get("name", "")
                      state = device.get("state", "")
                      if (device.get("isAvailable") is not True
                              or state not in ("Booted", "Shutdown")
                              or not (kind.startswith("com.apple.CoreSimulator.SimDeviceType.iPhone")
                                      or (not kind and name.startswith("iPhone")))):
                          continue
                      try:
                          identifier = device["udid"]
                          uuid.UUID(identifier)  # Validate without rewriting simctl's exact identifier.
                      except (KeyError, ValueError, TypeError, AttributeError):
                          continue
                      candidates.append((available[runtime], state == "Booted", name,
                                         identifier, runtime, state))
              if not candidates:
                  raise SystemExit("No available iPhone simulator with iOS 16 or newer is installed.")
              _, _, name, identifier, runtime, state = max(candidates)
              return {"udid": identifier, "name": name, "runtime": runtime, "state": state}

          evidence = Path(os.environ["IOS_EVIDENCE_DIR"])
          selected = select_simulator(
              json.loads((evidence / "devices.json").read_text()),
              json.loads((evidence / "runtimes.json").read_text()),
          )
          (evidence / "simulator.json").write_text(json.dumps(selected, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"udid={selected['udid']}\nstate={selected['state']}\n")
          print(json.dumps(selected, indent=2))
          PY

      - name: Boot the selected simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_STATE: ${{ steps.simulator.outputs.state }}
        run: |
          set -euo pipefail
          if [[ "$SIMULATOR_STATE" != 'Booted' ]]; then
            xcrun simctl boot "$SIMULATOR_UDID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b \
            2>&1 | tee "$IOS_EVIDENCE_DIR/simulator-boot.log"

      - name: Build the app and tests without signing
        id: build
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild -project apps/ssmcp-ios/SSMCP.xcodeproj -scheme SSMCP \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$IOS_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build-for-testing \
            2>&1 | tee "$IOS_EVIDENCE_DIR/build.log"

      - name: Run XCTest on the selected simulator
        id: tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild -project apps/ssmcp-ios/SSMCP.xcodeproj -scheme SSMCP \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$IOS_DERIVED_DATA" \
            -resultBundlePath "$IOS_EVIDENCE_DIR/ios-tests.xcresult" \
            -parallel-testing-enabled NO -only-testing:SSMCPTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test-without-building \
            2>&1 | tee "$IOS_EVIDENCE_DIR/tests.log"

      - name: Record and package successful simulator checks
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = Path(os.environ["IOS_EVIDENCE_DIR"])
          (evidence / "result.json").write_text(json.dumps({
              "source_commit": os.environ["SOURCE_COMMIT"],
              "target": "ios-simulator", "profile": "debug",
              "build_exit": 0, "test_exit": 0,
          }) + "\n")
          PY
          python3 scripts/release.py package-gui --platform ios --evidence "$IOS_EVIDENCE_DIR"

      - name: Retain the iOS simulator verification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ssmcp-gui-ios
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Record the validation scope
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            printf '### iOS client\n\n'
            printf -- '- Source commit: `%s`\n' "$SOURCE_COMMIT"
            printf -- '- Simulator Debug build: %s\n' "$BUILD_OUTCOME"
            printf -- '- XCTest: %s\n' "$TEST_OUTCOME"
            printf -- '- Scope: simulator compilation and protocol tests; physical-device UI and live gateway behavior are separate checks.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Shut down the simulator
        if: always() && steps.simulator.outputs.udid != ''
        continue-on-error: true
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl shutdown "$SIMULATOR_UDID"

      - name: Preserve iOS logs and XCTest results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-${{ needs.validate.outputs.ref }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ssmcp-gui-ci-ios
          if-no-files-found: warn
          retention-days: 7

  linux:
    name: Linux desktop Release and X11 window
    needs: validate
    if: needs.validate.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ needs.validate.outputs.ref }}
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/gui-desktop
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Record the source revision and require its lockfile
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -f apps/ssmcp-desktop/Cargo.lock
          evidence="$RUNNER_TEMP/ssmcp-gui-ci-linux"
          mkdir -p "$evidence"
          printf 'LINUX_EVIDENCE_DIR=%s\n' "$evidence" >> "$GITHUB_ENV"
          printf 'source_commit=%s\nworkflow_commit=%s\nrunner=%s/%s\n' \
            "$SOURCE_COMMIT" "$GITHUB_WORKFLOW_SHA" "$RUNNER_OS" "$RUNNER_ARCH" \
            > "$evidence/revision.txt"
      - name: Install the native X11 build and window-check tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            xvfb xauth x11-utils mesa-utils libgl1-mesa-dri fonts-noto-cjk xdotool imagemagick python3-xlib
      - name: Install Rust 1.100.0 for native Linux
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          targets: x86_64-unknown-linux-gnu
      - name: Restore Cargo dependencies for the Linux desktop
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-ubuntu-22.04
          workspaces: apps/ssmcp-desktop -> ../../target/gui-desktop
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and test the optimized native desktop
        id: native
        run: |
          set -euo pipefail
          rustc -Vv | tee "$LINUX_EVIDENCE_DIR/rustc.log"
          cargo -V | tee "$LINUX_EVIDENCE_DIR/cargo.log"
          set +e
          cargo test --manifest-path apps/ssmcp-desktop/Cargo.toml --locked --release \
            --target x86_64-unknown-linux-gnu 2>&1 | tee "$LINUX_EVIDENCE_DIR/tests.log"
          test_exit=${PIPESTATUS[0]}
          cargo build --manifest-path apps/ssmcp-desktop/Cargo.toml --locked --release \
            --target x86_64-unknown-linux-gnu 2>&1 | tee "$LINUX_EVIDENCE_DIR/build.log"
          build_exit=${PIPESTATUS[0]}
          set -e
          python3 - "$test_exit" "$build_exit" <<'PY'
          import json, os, sys
          from pathlib import Path
          result = {"source_commit": os.environ["SOURCE_COMMIT"], "target": "x86_64-unknown-linux-gnu",
                    "profile": "release", "test_exit": int(sys.argv[1]), "build_exit": int(sys.argv[2])}
          (Path(os.environ["LINUX_EVIDENCE_DIR"]) / "result.json").write_text(json.dumps(result, indent=2) + "\n")
          if result["test_exit"] or result["build_exit"]:
              raise SystemExit("Linux desktop Release build or tests failed")
          PY
          binary="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/ssmcp-desktop"
          test -x "$binary"
          ldd "$binary" | tee "$LINUX_EVIDENCE_DIR/dependencies.log"
          if grep -q 'not found' "$LINUX_EVIDENCE_DIR/dependencies.log"; then
            echo '::error::The Linux desktop executable has unresolved runtime libraries.'
            exit 1
          fi
      - name: Build and check the sibling Linux CLI from the same source and profile
        run: |
          set -euo pipefail
          cargo build --locked --release --target x86_64-unknown-linux-gnu --bin ssmcp \
            2>&1 | tee "$LINUX_EVIDENCE_DIR/cli-build.log"
          cli="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/ssmcp"
          "$cli" --version | tee "$LINUX_EVIDENCE_DIR/cli-version.log"
          python3 - "$cli" <<'PYCLI'
          import hashlib, json, os, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          with path.open("rb") as stream:
              sha = hashlib.file_digest(stream, "sha256").hexdigest()
          receipt = {"file": path.name, "bytes": path.stat().st_size, "sha256": sha,
                     "source_commit": os.environ["SOURCE_COMMIT"],
                     "target": "x86_64-unknown-linux-gnu", "profile": "release"}
          (Path(os.environ["LINUX_EVIDENCE_DIR"]) / "cli-executable.json").write_text(json.dumps(receipt))
          PYCLI
      - name: Observe the Release executable in a real X11 window
        id: window
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 45s xvfb-run --auto-servernum \
            --server-args='-screen 0 1280x900x24 +extension GLX -nolisten tcp' python3 - <<'PY'
          import hashlib, json, os, re, subprocess, time
          from pathlib import Path
          evidence = Path(os.environ["LINUX_EVIDENCE_DIR"])
          binary = Path(os.environ["CARGO_TARGET_DIR"]) / "x86_64-unknown-linux-gnu/release/ssmcp-desktop"
          renderer = subprocess.run(["glxinfo", "-B"], text=True, stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT, timeout=10)
          (evidence / "renderer.log").write_text(renderer.stdout)
          if renderer.returncode or "llvmpipe" not in renderer.stdout.lower():
              raise SystemExit("The Xvfb display must provide Mesa llvmpipe OpenGL")
          title = "ssmcp-desktop"
          window = {"source_commit": os.environ["SOURCE_COMMIT"], "target": "x86_64-unknown-linux-gnu",
                    "profile": "release", "backend": "x11-opengl", "renderer": "llvmpipe", "title": title,
                    "mapped": False, "width": 0, "height": 0, "exit_after_ms": 10000,
                    "binary_bytes": binary.stat().st_size, "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest()}
          started = time.monotonic()
          deadline = started + 30
          probe_text = ""
          with (evidence / "window.log").open("w") as log:
              first_frame = evidence / "first-frame.json"
              process = subprocess.Popen([str(binary), "--exit-after-ms", "10000",
                                          "--first-frame-receipt", str(first_frame)], stdout=log, stderr=subprocess.STDOUT)
              try:
                  while process.poll() is None and time.monotonic() < deadline:
                      try:
                          probe = subprocess.run(["xwininfo", "-name", title, "-stats"], text=True,
                                                 stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=1)
                      except subprocess.TimeoutExpired:
                          continue
                      probe_text = probe.stdout
                      width = re.search(r"(?m)^\s*Width:\s*(\d+)\s*$", probe_text)
                      height = re.search(r"(?m)^\s*Height:\s*(\d+)\s*$", probe_text)
                      if probe.returncode == 0 and "Map State: IsViewable" in probe_text and width and height:
                          window.update(mapped=True, width=int(width[1]), height=int(height[1]))
                          break
                      time.sleep(0.1)
                  if window["mapped"]:
                      while not first_frame.is_file() and time.monotonic() < deadline and process.poll() is None:
                          time.sleep(0.05)
                      if not first_frame.is_file():
                          raise RuntimeError("The mapped window did not render its connection form")
                      wid = subprocess.check_output(["xdotool", "search", "--onlyvisible", "--name",
                                                     "^ssmcp-desktop$"], text=True, timeout=3).strip()
                      def capture(name):
                          subprocess.run(["import", "-silent", "-window", wid, str(evidence / name)],
                                         check=True, timeout=4)
                      capture("first-run.png")
                      subprocess.run(["xdotool", "windowfocus", "--sync", wid], check=True, timeout=3)
                      subprocess.run(["xdotool", "type", "--clearmodifiers", "Alice"], check=True, timeout=3)
                      subprocess.run(["xdotool", "key", "Return"], check=True, timeout=3)
                      time.sleep(0.25)
                      capture("first-run-consent.png")
                      subprocess.run(["xdotool", "windowsize", "--sync", wid, "430", "575"],
                                     check=True, timeout=3)
                      time.sleep(0.25)
                      capture("first-run-narrow.png")
                  process.wait(timeout=max(0.001, deadline - time.monotonic()))
              finally:
                  if process.poll() is None:
                      process.kill()
                      process.wait(timeout=5)
                  window.update(exit_code=process.returncode, elapsed_ms=int((time.monotonic() - started) * 1000))
                  (evidence / "xwininfo.log").write_text(probe_text or "No mapped application window was observed.\n")
                  (evidence / "window.json").write_text(json.dumps(window, indent=2) + "\n")
          if not window["mapped"] or window["exit_code"] != 0 or not 10000 <= window["elapsed_ms"] < 30000:
              raise SystemExit("The Release executable did not complete its bounded native window check")
          PY
      - name: Connect two independent desktop windows to one loopback account
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24 +extension GLX -nolisten tcp' \
            /usr/bin/python3 scripts/e2e_desktop_windows.py \
            "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/ssmcp-desktop"
      - name: Package the exact Linux Release executable tested in Xvfb
        run: |
          python3 scripts/release.py package-gui --platform linux --evidence "$LINUX_EVIDENCE_DIR" \
            --binary "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/ssmcp-desktop"
      - name: Retain the downloadable Linux Release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ssmcp-gui-linux
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Record the validation scope
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          WINDOW_OUTCOME: ${{ steps.window.outcome }}
        run: |
          {
            printf '### Linux desktop client\n\n- Source commit: `%s`\n' "$SOURCE_COMMIT"
            printf -- '- Native Release build and Rust tests: %s\n' "$NATIVE_OUTCOME"
            printf -- '- Xvfb/Mesa llvmpipe mapped window and bounded clean exit: %s\n' "$WINDOW_OUTCOME"
            printf '%s\n' '- Scope: default X11/OpenGL backend, without a live CLI session. This is not GPU, Wayland-native or interactive session acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Linux build, test and actual window evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-${{ needs.validate.outputs.ref }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ssmcp-gui-ci-linux
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Windows CLI, process/IPC, and desktop acceptance
    needs: validate
    if: needs.validate.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      SOURCE_COMMIT: ${{ needs.validate.outputs.ref }}
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/gui-desktop
      CLI_TARGET_DIR: ${{ github.workspace }}/target/gui-cli
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'

      - name: Record the source revision and require its lockfile
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'ssmcp-gui-ci-windows'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $actualCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:SOURCE_COMMIT) {
            throw 'The checked-out commit does not match the requested commit.'
          }
          @(
            "source_commit=$actualCommit"
            "workflow_commit=$env:GITHUB_WORKFLOW_SHA"
            "runner=$env:RUNNER_OS/$env:RUNNER_ARCH"
          ) | Set-Content -Path (Join-Path $evidence 'revision.txt')
          if (-not (Test-Path 'apps/ssmcp-desktop/Cargo.lock' -PathType Leaf)) {
            throw 'The requested commit must contain apps/ssmcp-desktop/Cargo.lock; CI does not generate it.'
          }

      - name: Parse the Windows desktop acceptance script
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/e2e_windows_desktop.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }

      - name: Install Rust 1.100.0 for native Windows
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo dependencies for the Windows CLI and desktop
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-windows-2025
          workspaces: |
            . -> target/gui-cli
            apps/ssmcp-desktop -> ../../target/gui-desktop
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build and test with the Visual C++ environment
        id: native
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'ssmcp-gui-ci-windows'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere -PathType Leaf)) {
            throw 'Visual Studio discovery tool vswhere.exe is missing.'
          }
          $installations = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installations) {
            throw 'No Visual Studio installation with the x64 C++ tools is available.'
          }
          $visualStudio = ($installations | Select-Object -First 1).Trim()
          $developerShell = Join-Path $visualStudio 'Common7/Tools/Launch-VsDevShell.ps1'
          # zgpui's native build script directly invokes cl and lib. Keep this
          # environment and all Cargo commands in the same PowerShell step.
          & $developerShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-Command cl.exe, lib.exe, cargo.exe, rustc.exe |
            Format-Table Name, Source -AutoSize | Out-String |
            Tee-Object -FilePath (Join-Path $evidence 'native-tools.log')
          & rustc -Vv 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'rustc.log')
          if ($LASTEXITCODE -ne 0) { throw 'rustc version inspection failed.' }
          & cargo -V 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'cargo.log')
          if ($LASTEXITCODE -ne 0) { throw 'Cargo version inspection failed.' }

          # Reuse the native client checks from ci.yml; these execute Windows
          # process, IPC, CLI, and library tests on the requested source.
          & cargo test --locked --lib --bin ssmcp --test release_client --target-dir $env:CLI_TARGET_DIR 2>&1 |
            Tee-Object -FilePath (Join-Path $evidence 'cli-tests.log')
          $clientTestExit = $LASTEXITCODE
          & cargo build --locked --bin ssmcp --example native_plugin_fixture --target-dir $env:CLI_TARGET_DIR 2>&1 |
            Tee-Object -FilePath (Join-Path $evidence 'cli-build.log')
          $clientBuildExit = $LASTEXITCODE
          $pluginExit = $null
          if ($clientBuildExit -eq 0) {
            & cargo test --lib --locked --target-dir $env:CLI_TARGET_DIR runtime::plugins::tests::native_plugin_runtime_contract -- --ignored --exact 2>&1 |
              Tee-Object -FilePath (Join-Path $evidence 'native-plugin.log')
            $pluginExit = $LASTEXITCODE
          }

          & cargo test --manifest-path apps/ssmcp-desktop/Cargo.toml --locked --target x86_64-pc-windows-msvc 2>&1 |
            Tee-Object -FilePath (Join-Path $evidence 'tests.log')
          $testExit = $LASTEXITCODE
          & cargo build --manifest-path apps/ssmcp-desktop/Cargo.toml --locked --target x86_64-pc-windows-msvc 2>&1 |
            Tee-Object -FilePath (Join-Path $evidence 'build.log')
          $buildExit = $LASTEXITCODE
          [ordered]@{
            source_commit = $env:SOURCE_COMMIT
            target = 'x86_64-pc-windows-msvc'
            profile = 'debug'
            cli_test_exit = $clientTestExit
            cli_build_exit = $clientBuildExit
            native_plugin_exit = $pluginExit
            test_exit = $testExit
            build_exit = $buildExit
          } | ConvertTo-Json | Set-Content -Path (Join-Path $evidence 'result.json')
          if ($clientTestExit -ne 0 -or $clientBuildExit -ne 0 -or $pluginExit -ne 0 -or $testExit -ne 0 -or $buildExit -ne 0) {
            throw "Windows checks failed: CLI tests=$clientTestExit, CLI build=$clientBuildExit, native plugin=$pluginExit, desktop tests=$testExit, desktop build=$buildExit."
          }
          $cliExecutable = Join-Path $env:CLI_TARGET_DIR 'debug/ssmcp.exe'
          [ordered]@{
            file = 'ssmcp.exe'
            source_commit = $env:SOURCE_COMMIT
            target = 'x86_64-pc-windows-msvc'
            profile = 'debug'
            bytes = (Get-Item $cliExecutable).Length
            sha256 = (Get-FileHash -Algorithm SHA256 -Path $cliExecutable).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -Path (Join-Path $evidence 'cli-executable.json')
          $executable = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/debug/ssmcp-desktop.exe'
          if (-not (Test-Path $executable -PathType Leaf)) {
            throw 'Cargo reported success without the expected desktop executable.'
          }
          # Stage the CLI built above next to the desktop before the real-window check.
          $siblingCli = Join-Path (Split-Path -Parent $executable) 'ssmcp.exe'
          Copy-Item -LiteralPath $cliExecutable -Destination $siblingCli -Force
          if ((Get-FileHash $siblingCli).Hash -ne (Get-FileHash $cliExecutable).Hash) {
            throw 'The staged CLI differs from the same-source debug executable.'
          }
          [ordered]@{
            file = 'ssmcp-desktop.exe'
            bytes = (Get-Item $executable).Length
            sha256 = (Get-FileHash -Algorithm SHA256 -Path $executable).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -Path (Join-Path $evidence 'executable.json')

      - name: Exercise the Windows CLI and private process/IPC lifecycle
        id: cli_runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'ssmcp-gui-ci-windows'
          $binaryDirectory = Join-Path $env:CLI_TARGET_DIR 'debug'
          $cliExecutable = Join-Path $binaryDirectory 'ssmcp.exe'
          & $cliExecutable --version 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'cli-version.log')
          if ($LASTEXITCODE -ne 0) { throw 'The built Windows CLI did not report its version.' }
          & $cliExecutable --help 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'cli-help.log')
          if ($LASTEXITCODE -ne 0) { throw 'The built Windows CLI did not report its help.' }
          # The shared fixture owns its temporary state and foreground processes.
          # Service installation is previewed with --dry-run, never applied.
          & python scripts/e2e_service_portable.py --bin-dir $binaryDirectory --report (Join-Path $evidence 'session-service.json') --revision $env:SOURCE_COMMIT 2>&1 |
            Tee-Object -FilePath (Join-Path $evidence 'session-service.log')
          if ($LASTEXITCODE -ne 0) { throw 'Private Windows lifecycle acceptance failed or was blocked; inspect session-service.json.' }

      - name: Verify an empty overview without creating a session registry
        id: overview_runtime
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          @'
          import hashlib, json, os, shutil, subprocess, sys, uuid
          from pathlib import Path

          evidence = Path(os.environ['RUNNER_TEMP']) / 'ssmcp-gui-ci-windows'
          binary = Path(os.environ['CLI_TARGET_DIR']) / 'debug' / 'ssmcp.exe'
          overview_home = (Path(os.environ['RUNNER_TEMP']) / ('ssmcp-overview-empty-' + uuid.uuid4().hex)).resolve()
          expected = {
              'schema': 'ssmcp.overview.v1', 'scope': 'current_os_user',
              'sessions': [], 'truncated': False, 'skipped_invalid_entries': 0,
              'logs_omitted': True, 'automatic_command_retry': False, 'max_sessions': 256,
          }
          report = {
              'source_commit': os.environ['SOURCE_COMMIT'], 'status': 'failed',
              'command': ['ssmcp.exe', 'overview', '--json'], 'timeout_seconds': 15,
              'session_home': str(overview_home), 'exit_code': None, 'timed_out': False,
          }
          stdout, stderr = b'', b''
          try:
              if not overview_home.is_absolute() or overview_home.exists():
                  raise RuntimeError('The overview fixture requires a fresh absolute session home.')
              with binary.open('rb') as source:
                  report['executable_sha256'] = hashlib.file_digest(source, 'sha256').hexdigest()
              environment = dict(os.environ, SSMCP_SESSION_HOME=str(overview_home))
              result = subprocess.run([str(binary), 'overview', '--json'], env=environment,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=15)
              stdout, stderr = result.stdout, result.stderr
              report['exit_code'] = result.returncode
              if result.returncode != 0:
                  raise RuntimeError(f'overview exited with {result.returncode}')
              value = json.loads(stdout)
              if not isinstance(value, dict):
                  raise RuntimeError('overview did not return a JSON object.')
              report['checks'] = {
                  key: key in value and type(value[key]) is type(wanted) and value[key] == wanted
                  for key, wanted in expected.items()
              }
              if not all(report['checks'].values()):
                  raise RuntimeError('Unexpected overview fields: ' + ', '.join(
                      key for key, passed in report['checks'].items() if not passed))
              report['status'] = 'passed'
          except subprocess.TimeoutExpired as error:
              stdout, stderr = error.stdout or b'', error.stderr or b''
              report['timed_out'] = True
              report['error'] = 'overview exceeded the 15-second bound.'
          except Exception as error:
              report['error'] = f'{type(error).__name__}: {error}'
          finally:
              report['registry_created'] = overview_home.exists() or overview_home.is_symlink()
              if report['registry_created']:
                  report['status'] = 'failed'
                  report.setdefault('error', 'Read-only overview unexpectedly created its session home.')
                  try:
                      if overview_home.is_symlink() or overview_home.is_file():
                          overview_home.unlink()
                      else:
                          shutil.rmtree(overview_home)
                  except OSError as error:
                      report['cleanup_error'] = str(error)
              (evidence / 'overview.stdout.json').write_bytes(stdout)
              (evidence / 'overview.stderr.log').write_bytes(stderr)
              (evidence / 'overview-result.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          sys.exit(0 if report['status'] == 'passed' else 1)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Empty Windows overview acceptance failed; inspect overview-result.json.' }
      - name: Launch and capture the actual Windows desktop executable
        id: desktop_runtime
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'ssmcp-gui-ci-windows'
          $executable = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/debug/ssmcp-desktop.exe'
          & pwsh -NoLogo -NoProfile -File scripts/e2e_windows_desktop.ps1 -Binary $executable -EvidenceDirectory (Join-Path $evidence 'desktop-runtime') -SourceCommit $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Desktop runtime acceptance failed or was blocked; inspect desktop-runtime/result.json.' }

      - name: Package the tested Windows debug executable
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'ssmcp-gui-ci-windows'
          $executable = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/debug/ssmcp-desktop.exe'
          & python scripts/release.py package-gui --platform windows --evidence $evidence --binary $executable
          if ($LASTEXITCODE -ne 0) { throw 'Desktop packaging and source proof failed.' }

      - name: Retain the downloadable Windows debug archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ssmcp-gui-windows
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Record the validation scope
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          CLI_OUTCOME: ${{ steps.cli_runtime.outcome }}
          OVERVIEW_OUTCOME: ${{ steps.overview_runtime.outcome }}
          DESKTOP_OUTCOME: ${{ steps.desktop_runtime.outcome }}
        run: |
          $overviewStatus = 'not_run'
          $overviewReport = Join-Path $env:RUNNER_TEMP 'ssmcp-gui-ci-windows/overview-result.json'
          if (Test-Path -LiteralPath $overviewReport) {
            $overviewStatus = (Get-Content -LiteralPath $overviewReport -Raw | ConvertFrom-Json).status
          }
          $desktopStatus = 'not_run'
          $desktopReport = Join-Path $env:RUNNER_TEMP 'ssmcp-gui-ci-windows/desktop-runtime/result.json'
          if (Test-Path -LiteralPath $desktopReport) {
            $desktopStatus = (Get-Content -LiteralPath $desktopReport -Raw | ConvertFrom-Json).status
          }
          @(
            '### Windows CLI and desktop acceptance'
            ''
            ('- Source commit: `{0}`' -f $env:SOURCE_COMMIT)
            ('- Native MSVC Debug builds, shared CLI/library tests, and native plugin contract: {0}' -f $env:NATIVE_OUTCOME)
            ('- Actual CLI and private process/IPC lifecycle: {0}' -f $env:CLI_OUTCOME)
            ('- Empty current-user overview without registry creation: {0}; execution step: {1}' -f $overviewStatus, $env:OVERVIEW_OUTCOME)
            ('- Actual desktop window: {0}; execution step: {1}' -f $desktopStatus, $env:DESKTOP_OUTCOME)
            '- Evidence: executable hashes, private lifecycle report, owned window metadata, captured PNG, and stdout/stderr.'
            '- Scope: isolated fixtures and a bounded desktop window; no external account, live session, installed service, or human visual acceptance.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Preserve Windows build and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-${{ needs.validate.outputs.ref }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ssmcp-gui-ci-windows
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android debug APK and real Instrumentation
    needs: validate
    if: needs.validate.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_COMMIT: ${{ needs.validate.outputs.ref }}
      ANDROID_SERIAL: emulator-5554
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'

      - name: Prepare Android evidence and emulator directories
        run: |
          set -euo pipefail
          printf 'ANDROID_EVIDENCE_DIR=%s\nANDROID_AVD_HOME=%s\n' \
            "$RUNNER_TEMP/ssmcp-gui-ci-android" "$RUNNER_TEMP/ssmcp-android-avd" >> "$GITHUB_ENV"

      - name: Install Linux emulator runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Install fixed Gradle and emulator archives on the runner
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -d "$JAVA_HOME_21_X64"
          mkdir -p "$ANDROID_EVIDENCE_DIR" "$ANDROID_AVD_HOME" "$RUNNER_TEMP/ssmcp-android-tools"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version 2>&1 | tee "$ANDROID_EVIDENCE_DIR/java.log"
          printf 'source_commit=%s\nworkflow_commit=%s\nrunner=%s/%s\n' \
            "$SOURCE_COMMIT" "$GITHUB_WORKFLOW_SHA" "$RUNNER_OS" "$RUNNER_ARCH" \
            > "$ANDROID_EVIDENCE_DIR/revision.txt"
          # Published upstream SHA-256 values:
          # https://gradle.org/release-checksums/
          # https://developer.android.com/studio/emulator_archive (36.2.12)
          cd "$RUNNER_TEMP/ssmcp-android-tools"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          printf '%s  gradle.zip\n' 31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26 \
            | sha256sum --check - | tee "$ANDROID_EVIDENCE_DIR/gradle-download.log"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            https://dl.google.com/android/repository/emulator-linux_x64-14214601.zip -o emulator.zip
          printf '%s  emulator.zip\n' 55e7ce272dd27413855c81b4629c107a1553d07a2f77fa55a6049fdca22f4221 \
            | sha256sum --check - | tee "$ANDROID_EVIDENCE_DIR/emulator-download.log"
          unzip -q gradle.zip
          unzip -q emulator.zip
          printf '%s\n' "$RUNNER_TEMP/ssmcp-android-tools/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ssmcp-android-tools/emulator/emulator" -version \
            2>&1 | tee "$ANDROID_EVIDENCE_DIR/emulator-version.log"

      - name: Install the API 35 SDK and emulator image
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(printf 'y\n%.0s' {1..100}) > "$ANDROID_EVIDENCE_DIR/licenses.log"
          for attempt in 1 2 3; do
            attempt_log="$ANDROID_EVIDENCE_DIR/sdk-install-$attempt.log"
            if "$sdkmanager" --install 'platform-tools' 'cmdline-tools;16.0' 'platforms;android-35' \
              'build-tools;35.0.0' 'system-images;android-35;google_apis;x86_64' \
              2>&1 | tee "$attempt_log"; then
              cp "$attempt_log" "$ANDROID_EVIDENCE_DIR/sdk-install.log"
              break
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Fq 'Error on ZipFile' "$attempt_log"; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          # SDK Manager verifies its archive metadata. Retain the resolved package
          # revisions; a rebuilt debug APK is not promised to be byte-identical.
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          sdk = Path(os.environ["ANDROID_SDK_ROOT"])
          evidence = Path(os.environ["ANDROID_EVIDENCE_DIR"])
          with (evidence / "sdk-packages.log").open("w") as output:
              for directory in ("cmdline-tools/16.0", "platforms/android-35", "build-tools/35.0.0",
                                "system-images/android-35/google_apis/x86_64", "platform-tools"):
                  metadata = sdk / directory / "source.properties"
                  data = metadata.read_bytes()
                  output.write(f"{directory} sha256={hashlib.sha256(data).hexdigest()}\n")
                  output.write(data.decode("utf-8") + "\n")
          PY
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$PATH"
          printf '%s\n' "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          command -v adb | tee "$ANDROID_EVIDENCE_DIR/adb-path.log"
          gradle --version 2>&1 | tee "$ANDROID_EVIDENCE_DIR/gradle-version.log"
          adb version 2>&1 | tee "$ANDROID_EVIDENCE_DIR/adb-version.log"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Compile the installed native CLI for Android devices and the emulator
        run: |
          set -euo pipefail
          ndk_revision=30.0.16248370
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ndk_revision"
          if [[ ! -f "$ANDROID_NDK_HOME/source.properties" ]]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk_revision"
          fi
          grep -Fx "Pkg.Revision = $ndk_revision" "$ANDROID_NDK_HOME/source.properties"
          apps/ssmcp-android/build-native.sh 2>&1 | tee "$ANDROID_EVIDENCE_DIR/native-build.log"

      - name: Package the same arm64 CLI as an installable Magisk module
        if: github.event_name == 'workflow_dispatch' && github.workflow == 'GUI clients'
        run: |
          set -euo pipefail
          module="$RUNNER_TEMP/magisk/packaging/magisk"
          mkdir -p "$RUNNER_TEMP/magisk"
          git archive "$SOURCE_COMMIT" packaging/magisk/kam.toml packaging/magisk/src |
            tar -x -C "$RUNNER_TEMP/magisk"
          # The normal hook compiles the CLI. The preceding step built this exact
          # revision for API 26, so stage its executable and package it with Kam.
          executable="$PWD/apps/ssmcp-android/app/src/main/jniLibs/arm64-v8a/libssmcp.so"
          cmp "$executable" "${CARGO_TARGET_DIR:-$PWD/target}/aarch64-linux-android/release/ssmcp"
          install -Dm755 "$executable" "$module/src/ssmcp/bin/ssmcp"
          mkdir -p "$module/hooks"
          cargo install --locked --git https://github.com/MemDeco-WG/Kam.git --rev 74f50bd219f88633d8cd07d61e89d05478b2fd55 kam
          kam_bin="${CARGO_HOME:-$HOME/.cargo}/bin/kam"
          (cd "$module" && "$kam_bin" export && "$kam_bin" check && "$kam_bin" build)
          archive="$module/dist/ssmcp-magisk-arm64.zip"
          cmp "$executable" <(unzip -p "$archive" bin/ssmcp)
          PYTHONPATH=scripts python3 -c 'from pathlib import Path; import release, sys; root=Path.cwd(); release.verify_magisk_archive(root, Path(sys.argv[1]), release.version(root))' "$archive"
          (cd "$module/dist" && sha256sum ssmcp-magisk-arm64.zip > ssmcp-magisk-arm64.zip.sha256)

      - name: Retain the installable Magisk module
        if: github.event_name == 'workflow_dispatch' && github.workflow == 'GUI clients'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ssmcp-magisk-arm64
          path: |
            ${{ runner.temp }}/magisk/packaging/magisk/dist/ssmcp-magisk-arm64.zip
            ${{ runner.temp }}/magisk/packaging/magisk/dist/ssmcp-magisk-arm64.zip.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Restore Gradle dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-overwrite-existing: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build the debug app and custom Instrumentation APK
        id: build
        working-directory: apps/ssmcp-android
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest \
            2>&1 | tee "$ANDROID_EVIDENCE_DIR/build.log"
          for abi in arm64-v8a x86_64; do
            cmp "app/src/main/jniLibs/$abi/libssmcp.so" <(unzip -p app/build/outputs/apk/debug/app-debug.apk "lib/$abi/libssmcp.so")
          done
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk \
            2>&1 | tee "$ANDROID_EVIDENCE_DIR/apk-signature.log"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            "$ANDROID_EVIDENCE_DIR/app-debug-androidTest.apk"

      - name: Run the custom Instrumentation on an API 35 emulator
        id: tests
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          printf 'no\n' | "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/avdmanager" create avd \
            --force --name ssmcp-ci-api35 --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
          "$RUNNER_TEMP/ssmcp-android-tools/emulator/emulator" -avd ssmcp-ci-api35 \
            -port 5554 -no-window -gpu swiftshader_indirect -no-audio -no-snapshot \
            -no-boot-anim -accel on -camera-back none -camera-front none \
            > "$ANDROID_EVIDENCE_DIR/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'timeout 10 adb emu kill >/dev/null 2>&1 || kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 180 adb wait-for-device
          deadline=$((SECONDS + 240))
          until [[ "$(timeout 10 adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; do
            if (( SECONDS >= deadline )); then
              echo '::error::The API 35 emulator did not finish booting.'
              exit 1
            fi
            sleep 2
          done
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 35
          adb shell getprop > "$ANDROID_EVIDENCE_DIR/device.log"
          adb install -r apps/ssmcp-android/app/build/outputs/apk/debug/app-debug.apk \
            2>&1 | tee "$ANDROID_EVIDENCE_DIR/install-app.log"
          adb install -r "$ANDROID_EVIDENCE_DIR/app-debug-androidTest.apk" \
            2>&1 | tee "$ANDROID_EVIDENCE_DIR/install-tests.log"
          timeout 120 adb shell am instrument -w \
            dev.ssmcp.mobile.test/dev.ssmcp.mobile.ProtocolInstrumentation \
            2>&1 | tee "$ANDROID_EVIDENCE_DIR/tests.log"
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import release
          evidence = Path(os.environ["ANDROID_EVIDENCE_DIR"])
          release.validate_android_instrumentation((evidence / "tests.log").read_text())
          (evidence / "result.json").write_text(json.dumps({
              "source_commit": os.environ["SOURCE_COMMIT"],
              "target": "android-api-35-x86_64", "profile": "debug",
              "build_exit": 0, "test_exit": 0,
          }) + "\n")
          PY

      - name: Package the tested debug APK and source receipt
        run: |
          python3 scripts/release.py package-gui --platform android \
            --evidence "$ANDROID_EVIDENCE_DIR" \
            --binary apps/ssmcp-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Retain the Android debug release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ssmcp-gui-android
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Record Android validation scope
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            printf '### Android client\n\n'
            printf -- '- Source commit: %s\n' "$SOURCE_COMMIT"
            printf -- '- Debug APK build: %s\n' "$BUILD_OUTCOME"
            printf -- '- API 35 custom Instrumentation: %s\n' "$TEST_OUTCOME"
            printf -- '- Scope: system WebView pairing with the packaged CLI on loopback, selection of a live foreground session, control lease, pause and release.\n'
            printf -- '- The APK uses the runner debug certificate; no production signing or app-store publication.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve Android evidence and the test APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-${{ needs.validate.outputs.ref }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ssmcp-gui-ci-android
          if-no-files-found: warn
          retention-days: 7
