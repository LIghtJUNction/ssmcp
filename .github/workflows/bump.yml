name: Bump version

on:
  workflow_dispatch:
    inputs:
      level:
        description: none publishes the current application version; other choices increment from this run's original commit
        required: true
        default: none
        type: choice
        options: [none, patch, minor, major, custom]
      custom_version:
        description: Required for custom, without a leading v; must increase the original version
        required: false
        type: string
      dry_run:
        description: Preview and validate without changing source files, commits, refs, tags or publishing
        required: false
        default: false
        type: boolean
      publish:
        description: Prepare an immutable tag and dispatch Release with server deployment disabled
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: bump-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitHub preserves github.sha across reruns. Never recalculate from a
          # newer main after the first attempt has already committed a version.
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Prepare or reuse the version from the original workflow commit
        id: version
        env:
          BUMP_LEVEL: ${{ inputs.level }}
          BUMP_CUSTOM_VERSION: ${{ inputs.custom_version }}
          BUMP_DRY_RUN: ${{ inputs.dry_run }}
          BUMP_PUBLISH: ${{ inputs.publish }}
        run: |
          args=(--baseline "$GITHUB_SHA" --level "$BUMP_LEVEL")
          if [ -n "$BUMP_CUSTOM_VERSION" ]; then
            args+=(--custom-version "$BUMP_CUSTOM_VERSION")
          fi
          if [ "$BUMP_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$BUMP_PUBLISH" != "true" ]; then
            args+=(--no-publish)
          fi
          python3 -B scripts/bump_release.py prepare "${args[@]}" --report "$RUNNER_TEMP/bump-preparation.json"
      - name: Keep the exact prepared version receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bump-preparation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bump-preparation.json
          if-no-files-found: warn
          retention-days: 30

  dispatch_release:
    needs: bump
    if: inputs.dry_run != true && inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Dispatch Release once and retain the original API response
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
          PREPARED_SHA: ${{ needs.bump.outputs.sha }}
        # A GITHUB_TOKEN tag push does not trigger another workflow. Explicitly
        # dispatch main with the immutable tag, build_only=false, deploy_server=false.
        # Reruns never issue another POST, including after an ambiguous response.
        run: |
          python3 -B scripts/bump_release.py dispatch \
            --tag "$RELEASE_TAG" --sha "$PREPARED_SHA" --baseline "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --report-dir "$RUNNER_TEMP/bump-dispatch"
      - name: Keep the Actions dispatch capture even when delivery is uncertain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bump-dispatch-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bump-dispatch/
          if-no-files-found: warn
          retention-days: 30
