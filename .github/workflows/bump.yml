name: Bump version

on:
  workflow_dispatch:
    inputs:
      level:
        description: Version component to increment, commit and validate for publishing
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: bump-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Bump package and lockfile together
        id: version
        env:
          BUMP_LEVEL: ${{ inputs.level }}
        run: python3 scripts/release.py bump "$BUMP_LEVEL"
      - name: Commit and push the version on main
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release $RELEASE_TAG"
          git push origin HEAD:main

  dispatch_release:
    needs: bump
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start checks and publishing for the new main version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # GITHUB_TOKEN pushes do not start another push workflow.
        # Release creates the version tag only after all checks and packaging pass.
        run: gh workflow run release.yml --ref main
