name: Bump version

on:
  workflow_dispatch:
    inputs:
      level:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Bump package and lockfile together
        id: version
        env:
          BUMP_LEVEL: ${{ inputs.level }}
        run: python3 scripts/release.py bump "$BUMP_LEVEL"
      - name: Commit and push the version on main
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release $RELEASE_TAG"
          git push origin HEAD:main
      - name: Start release validation and publishing
        env:
          GH_TOKEN: ${{ github.token }}
        # A push made by GITHUB_TOKEN does not trigger another push workflow.
        run: gh workflow run release.yml --ref main
