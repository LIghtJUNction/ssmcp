name: Bump version

on:
  workflow_dispatch:
    inputs:
      level:
        description: Increment only the application version; independent library versions stay pinned
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, custom]
      custom_version:
        description: Required for custom, without a leading v; must increase the current version
        required: false
        type: string
      dry_run:
        description: Preview and validate without changing files, committing, tagging or publishing
        required: false
        default: false
        type: boolean
      publish:
        description: After the version commit, create an immutable tag and start the official release
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: bump-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Bump package and lockfile together
        id: version
        env:
          BUMP_LEVEL: ${{ inputs.level }}
          BUMP_CUSTOM_VERSION: ${{ inputs.custom_version }}
          BUMP_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=("$BUMP_LEVEL")
          if [ -n "$BUMP_CUSTOM_VERSION" ]; then
            args+=(--custom-version "$BUMP_CUSTOM_VERSION")
          fi
          if [ "$BUMP_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/release.py bump "${args[@]}"
      - name: Commit and push the version on main
        if: inputs.dry_run != true
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release $RELEASE_TAG"
          git push origin HEAD:main
      - name: Create the requested release tag without moving an existing tag
        if: inputs.dry_run != true && inputs.publish == true
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/release.py tag "$RELEASE_TAG" "$(git rev-parse HEAD)"

  dispatch_release:
    needs: bump
    if: inputs.dry_run != true && inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start checks and publishing for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
        # A tag pushed with GITHUB_TOKEN does not start a push workflow.
        # workflow_dispatch does, and the explicit tag keeps empty-input runs as preflight only.
        run: gh workflow run release.yml --ref main -f "tag=$RELEASE_TAG"
