name: Windows ARM64 shell marker
on:
  push:
    branches: [qa/windows-arm-marker-921f]
    paths: [.github/workflows/windows-arm-marker.yml, scripts/windows_arm_console.py, src/client/windows_arm_shell_tests.rs, src/client/windows_cwd_tests.rs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell-marker:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-client-windows-11-arm
          cache-bin: false
          save-if: 'false'
      - name: Compare cmd, Windows PowerShell and PowerShell 7
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'Expected an ARM64 OS' }
          if ((rustc -vV | Select-String '^host:').ToString().Trim() -ne 'host: aarch64-pc-windows-msvc') { throw 'Expected native ARM64 rustc' }
          $env:SSMCP_ARM_CMD = (Get-Command cmd.exe -CommandType Application).Source
          $env:SSMCP_ARM_LEGACY = (Get-Command powershell.exe -CommandType Application).Source
          $env:SSMCP_ARM_PWSH = (Get-Command pwsh.exe -CommandType Application).Source
          $env:SSMCP_ARM_REPORT = Join-Path $env:RUNNER_TEMP 'ssmcp-arm-shell.json'
          cargo test --locked --lib client::windows_cwd_tests::arm::compare_shell_input_and_startup -- --ignored --exact --nocapture
          $status = $LASTEXITCODE
          if (!(Test-Path -LiteralPath $env:SSMCP_ARM_REPORT)) { throw 'No diagnostic report produced' }
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: arm-shell-marker-${{ github.sha }}
          path: ${{ runner.temp }}/ssmcp-arm-shell.json
          if-no-files-found: error
          retention-days: 7
