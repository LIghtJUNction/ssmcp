name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or retry (for example v0.5.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate the tag, locked version and main ancestry
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python scripts/release.py validate --tag "$RELEASE_TAG"
      - name: Test publication safeguards
        run: python -m unittest discover -s scripts -p 'test_release.py' -v
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    needs: validate
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            test_args: --all-targets
            build_args: --bins
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            test_args: --all-targets
            build_args: --bins
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            test_args: --lib --bin ssmcp
            build_args: --bin ssmcp
          - target: aarch64-apple-darwin
            runner: macos-15
            test_args: --lib --bin ssmcp
            build_args: --bin ssmcp
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            test_args: --lib --bin ssmcp
            build_args: --bin ssmcp
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            test_args: --lib --bin ssmcp
            build_args: --bin ssmcp
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      TARGET: ${{ matrix.target }}
      TEST_ARGS: ${{ matrix.test_args }}
      BUILD_ARGS: ${{ matrix.build_args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
          components: clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server nodejs bubblewrap util-linux rsync
      - name: Lint the native target
        run: |
          read -r -a test_args <<< "$TEST_ARGS"
          cargo clippy --locked --target "$TARGET" "${test_args[@]}" -- -D warnings
      - name: Test the native target
        run: |
          read -r -a test_args <<< "$TEST_ARGS"
          cargo test --locked --target "$TARGET" "${test_args[@]}"
      - name: Build optimized executables
        run: |
          read -r -a build_args <<< "$BUILD_ARGS"
          cargo build --locked --release --target "$TARGET" "${build_args[@]}"
      - name: Smoke test and package executables
        run: python scripts/release.py package --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssmcp-${{ matrix.target }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish_crates:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ssmcp-*
          merge-multiple: true
          path: dist
      - name: Recheck tag identity and every target archive
        run: |
          python scripts/release.py validate --tag "$RELEASE_TAG"
          python scripts/release.py checksums
      - name: Verify the crates.io package
        run: cargo publish --locked --dry-run
      - name: Publish to crates.io and verify the uploaded checksum
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_REGISTY_TOKEN }}
        run: python scripts/release.py publish

  publish_release:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ssmcp-*
          merge-multiple: true
          path: dist
      - name: Recheck tag identity and every target archive
        run: |
          python scripts/release.py validate --tag "$RELEASE_TAG"
          python scripts/release.py checksums
      - name: Publish GitHub Release after uploading all verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py release --tag "$RELEASE_TAG"
