name: Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to retry; leave empty to release main
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
      create_tag: ${{ steps.release.outputs.create_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - id: release
        name: Validate tag, version and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_AUTO: ${{ github.ref == 'refs/heads/main' && !inputs.tag }}
        run: |
          if [ "$RELEASE_AUTO" = true ]; then
            python3 scripts/release.py prepare --auto
          else
            python3 scripts/release.py prepare "$RELEASE_TAG"
          fi

  checks:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build:
    name: Package ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - name: Build client and Linux server
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RELEASE_TARGET" == *-linux-* ]]; then
            cargo build --locked --release --target "$RELEASE_TARGET" --bins
          else
            cargo build --locked --release --target "$RELEASE_TARGET" --bin ssmcp
          fi
      - name: Package and verify native executables
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/release.py package --target "$RELEASE_TARGET"
      - name: Install, update and reject a damaged download
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/test_installers.py "$RELEASE_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [prepare, checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.100.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Require all six archives and write checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          python3 scripts/release.py checksums
      - name: Verify the packaged source
        run: cargo package --locked
      - name: Check registry identity and publishing credentials before tagging
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_REGISTY_TOKEN }}
        run: python3 scripts/release.py check-registry
      - name: Create the validated main release tag
        if: needs.prepare.outputs.create_tag == 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 scripts/release.py tag "$RELEASE_TAG" "$RELEASE_SHA"
      - name: Recheck release tag identity
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/release.py validate --tag "$RELEASE_TAG"
      - name: Publish verified crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_REGISTY_TOKEN }}
        run: python3 scripts/release.py publish
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/release.py release --tag "$RELEASE_TAG"
