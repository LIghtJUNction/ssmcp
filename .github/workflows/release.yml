name: Release

on:
  push:
    branches: [release-check]
    tags: ['v*']
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish or retry; leave empty to build and test main without publishing
        required: false
        type: string
      deploy_server:
        description: Deploy after publication; disable only when an explicit later server switch is required
        required: false
        default: true
        type: boolean
      build_only:
        description: Explicit preflight flag; an empty tag already selects preflight
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/release-check' && !github.event.created) ||
      (github.event_name == 'create' && github.ref == 'refs/heads/release-check' && github.event.ref_type == 'branch') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
      publish: ${{ steps.tag.outputs.publish }}
      build_only: ${{ steps.tag.outputs.build_only }}
      deploy_server: ${{ steps.deployment.outputs.deploy_server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || (github.ref == 'refs/heads/release-check' && 'main') || github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate the tag, versions, main ancestry and pinned submodules
        id: tag
        run: python scripts/release.py validate --event
      - name: Select deployment after validated publication
        id: deployment
        env:
          RELEASE_PUBLISH: ${{ steps.tag.outputs.publish }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python - <<'PY'
          # BEGIN release deployment policy
          import json
          import os
          import re

          publish = os.environ["RELEASE_PUBLISH"]
          if publish not in ("true", "false"):
              raise ValueError("validated publish output must be true or false")
          requested = True
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
                  event = json.load(stream)
              inputs = event.get("inputs", {})
              if not isinstance(inputs, dict):
                  raise ValueError("workflow inputs must be an object")
              requested = inputs.get("deploy_server", True)
              if type(requested) is bool:
                  pass
              elif isinstance(requested, str) and requested in ("true", "false"):
                  requested = requested == "true"
              else:
                  raise ValueError("the deploy_server input must be a boolean")
          version = os.environ.get("RELEASE_VERSION", "")
          match = re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?", version)
          if not match or any(part.isdigit() and len(part) > 1 and part.startswith("0")
                              for part in (match.group(4) or "").split(".")):
              raise ValueError("validated version output must be a release version")
          # Published versions keep this record: retries must not restart active relays.
          deferred_versions = {
              "0.10.15": "Preserve active relay sessions until a separate non-disruptive server switch is verified.",
              "0.10.16": "Preserve active relay sessions until a separate non-disruptive server switch is verified.",
          }
          deferred = deferred_versions.get(version)
          deploy = "true" if publish == "true" and requested and deferred is None else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"deploy_server={deploy}\n")
          print(json.dumps({"publish": publish, "deploy_server": deploy, "version": version,
                            "deployment_deferred": deferred}))
          # END release deployment policy
          PY
      - name: Test publication safeguards
        run: python -m unittest discover -s scripts -p 'test_release.py' -v
      - name: Test deployment identity, artifact and rollback safeguards
        run: python -W error -m unittest discover -s scripts -p 'test_server_deploy.py' -v
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  checks:
    needs: validate
    if: needs.validate.outputs.publish == 'true' || needs.validate.outputs.build_only == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  build:
    needs: validate
    if: needs.validate.outputs.publish == 'true' || needs.validate.outputs.build_only == 'true'
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            build_args: --bins
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            build_args: --bins
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            build_args: --bin ssmcp
          - target: aarch64-apple-darwin
            runner: macos-15
            build_args: --bin ssmcp
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            build_args: --bin ssmcp
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            build_args: --bin ssmcp
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      BUILD_ARGS: ${{ matrix.build_args }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build optimized executables
        run: |
          read -r -a build_args <<< "$BUILD_ARGS"
          cargo build --locked --release --target "$TARGET" "${build_args[@]}"
      - name: Smoke test and package executables
        run: python scripts/release.py package --target "$TARGET"
      - name: Verify native installation, update and failed-download handling
        run: python scripts/test_installers.py "$TARGET"
      - name: Test native Windows browser bootstrap safeguards
        if: contains(matrix.target, 'windows')
        run: pwsh -NoProfile -NonInteractive -File scripts/test_windows_browser_bootstrap.ps1 -Out "out/windows-browser-bootstrap-${{ matrix.target }}.json"
      - name: Smoke test real native Windows browser dependencies
        if: contains(matrix.target, 'windows')
        timeout-minutes: 35
        run: >-
          pwsh -NoProfile -NonInteractive -File scripts/smoke_windows_browser.ps1
          -ClientPath "target/$TARGET/release/ssmcp.exe"
          -Target "$TARGET" -ExpectedVersion "$RELEASE_VERSION"
          -Out "out/windows-native-browser-${{ matrix.target }}.json"
      - name: Retain real Windows browser dependency evidence
        if: always() && contains(matrix.target, 'windows')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-browser-${{ matrix.target }}
          path: out/windows-native-browser-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain Windows browser bootstrap evidence
        if: always() && contains(matrix.target, 'windows')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-browser-bootstrap-${{ matrix.target }}
          path: out/windows-browser-bootstrap-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssmcp-${{ matrix.target }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  verify_linux_runtime:
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true' || needs.validate.outputs.build_only == 'true'
    name: Verify installed server ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ssmcp-${{ matrix.target }}
          path: dist
      - name: Install system runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nodejs bubblewrap util-linux apparmor-profiles
          if test -e /sys/module/apparmor/parameters/enabled && grep -q Y /sys/module/apparmor/parameters/enabled; then
            if test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict; then
              sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
              sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            fi
          fi
      - name: Verify release installation under service restrictions
        run: |
          runtime_archive="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import release; print(release.asset_name(sys.argv[1]))' "$TARGET")"
          sudo install -Dm0644 "dist/$runtime_archive" /usr/local/libexec/ssmcp-runtime-test/release.tar.gz
          sudo install -Dm0644 scripts/test_server_runtime.py /usr/local/libexec/ssmcp-runtime-test/test_server_runtime.py
          restrictions=()
          while IFS= read -r property; do
            restrictions+=("--property=$property")
          done < <(grep -E '^(NoNewPrivileges|PrivateTmp|PrivateDevices|ProtectSystem|ProtectHome|ProtectKernelTunables|ProtectControlGroups|RestrictAddressFamilies|ReadWritePaths)=' packaging/ssmcpd.service)
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit=ssmcp-release-runtime-test \
            --uid="$(id -u)" --gid="$(id -g)" \
            --setenv=PATH=/usr/bin:/bin \
            "${restrictions[@]}" \
            /usr/bin/python3 /usr/local/libexec/ssmcp-runtime-test/test_server_runtime.py \
            --archive /usr/local/libexec/ssmcp-runtime-test/release.tar.gz

  finalize:
    needs: [validate, checks, build, verify_linux_runtime]
    if: needs.validate.outputs.publish == 'true' || needs.validate.outputs.build_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ssmcp-*
          merge-multiple: true
          path: dist
      - name: Recheck the source, submodules and existing release tag
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/release.py validate --tag "$RELEASE_TAG"
          else
            python scripts/release.py validate --build-only
          fi
      - name: Require every verified target archive
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          python scripts/release.py checksums
      - name: Verify the application source package
        run: cargo package --locked --package ssmcp
      - name: Retain the verified application crate for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-crates
          path: target/package/*.crate
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish_crates:
    needs: [validate, finalize]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-crates
          path: target/package
      - name: Recheck release tag identity
        run: python scripts/release.py validate --tag "$RELEASE_TAG"
      - name: Publish ssmcp after independent dependency preflight
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_REGISTY_TOKEN }}
        run: python scripts/release.py publish

  publish_release:
    needs: [validate, finalize]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ssmcp-*
          merge-multiple: true
          path: dist
      - name: Recheck tag identity and every target archive
        run: |
          python scripts/release.py validate --tag "$RELEASE_TAG"
          cp scripts/install.sh scripts/install.ps1 dist/
          python scripts/release.py checksums
      - name: Publish GitHub Release after uploading all verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py release --tag "$RELEASE_TAG"

  deploy_server:
    needs: [validate, publish_release]
    if: needs.validate.outputs.publish == 'true' && needs.validate.outputs.deploy_server == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-server.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      commit: ${{ needs.validate.outputs.sha }}
    secrets:
      SSMCP_DEPLOY_HOST: ${{ secrets.SSMCP_DEPLOY_HOST }}
      SSMCP_DEPLOY_SSH_KEY: ${{ secrets.SSMCP_DEPLOY_SSH_KEY }}
      SSMCP_DEPLOY_KNOWN_HOSTS: ${{ secrets.SSMCP_DEPLOY_KNOWN_HOSTS }}
