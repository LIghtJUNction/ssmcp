version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /apps/ssmcp-desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      patches:
        update-types: [patch]
    # Minor and major upgrades remain individual PRs, including breaking 0.x minors.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
